<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curriculum Explorer</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..700&family=Google+Sans+Code:wght@400..600&display=swap">
  <style>
    :root {
      --ff-sans: 'Google Sans Flex', 'Google Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --ff-mono: 'Google Sans Code', ui-monospace, 'Cascadia Code', Consolas, monospace;

      --bg: #fdfcfc;
      --surface: #ffffff;
      --surface-dim: #f2f0f0;
      --surface-hover: #e6e6e6;
      --stroke: #e3e3e3;
      --text: #000000;
      --text-2: rgba(0, 0, 0, 0.58);
      --primary: #3186ff;
      --primary-soft: #dcf1ff;
      --on-primary: #ffffff;
      --positive: #008052;
      --positive-soft: #daf9d4;
      --error: #de2d29;
      --error-soft: #ffdeec;
      --warning: #997112;
      --warning-soft: #fff1c9;

      --c-networking: #2575fc;
      --c-cloud: #705ec2;
      --c-security: #c84288;

      --sp-xs: 4px; --sp-s: 8px; --sp-m: 12px; --sp-l: 16px; --sp-xl: 20px; --sp-xxl: 24px;
      --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-full: 999px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f0f0f; --surface: #1c1c1c; --surface-dim: #141414; --surface-hover: #2a2a2a;
        --stroke: #333333; --text: #ffffff; --text-2: rgba(255, 255, 255, 0.62);
        --primary: #5aa0ff; --primary-soft: #14204f; --on-primary: #000000;
        --positive: #0ebc5f; --positive-soft: #0c2a19; --error: #ff5a59; --error-soft: #3a1418;
        --warning: #ffcc4d; --warning-soft: #33290f;
        --c-networking: #6ea2ff; --c-cloud: #a597ff; --c-security: #ff7fbf;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f0f0f; --surface: #1c1c1c; --surface-dim: #141414; --surface-hover: #2a2a2a;
      --stroke: #333333; --text: #ffffff; --text-2: rgba(255, 255, 255, 0.62);
      --primary: #5aa0ff; --primary-soft: #14204f; --on-primary: #000000;
      --positive: #0ebc5f; --positive-soft: #0c2a19; --error: #ff5a59; --error-soft: #3a1418;
      --warning: #ffcc4d; --warning-soft: #33290f;
      --c-networking: #6ea2ff; --c-cloud: #a597ff; --c-security: #ff7fbf;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--ff-sans);
      font-size: 14px;
      line-height: 1.45;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .app {
      max-width: 880px;
      margin: 0 auto;
      padding: var(--sp-l);
      display: flex;
      flex-direction: column;
      gap: var(--sp-m);
    }

    /* Header */
    .header-card {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: var(--r-m);
      padding: var(--sp-l);
      display: flex;
      flex-direction: column;
      gap: var(--sp-m);
    }
    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--sp-m);
    }
    .header-top h1 { margin: 0; font-size: 24px; font-weight: 500; letter-spacing: -0.2px; }
    .header-top p { margin: 2px 0 0; color: var(--text-2); }
    .pill-row { display: flex; flex-wrap: wrap; gap: var(--sp-xs); align-items: center; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-xs);
      background: var(--surface-dim);
      border: 1px solid var(--stroke);
      border-radius: var(--r-full);
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 540;
      white-space: nowrap;
    }
    .pill b { font-family: var(--ff-mono); font-weight: 600; }
    .overall-bar {
      height: 6px;
      background: var(--surface-dim);
      border-radius: var(--r-full);
      overflow: hidden;
    }
    .overall-bar span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--positive);
      border-radius: var(--r-full);
      transition: width 0.3s ease;
    }
    .legend { display: flex; flex-wrap: wrap; gap: var(--sp-xs); }
    .type-tag {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: var(--r-full);
      background: var(--surface-dim);
      color: var(--text-2);
      border: 1px solid var(--stroke);
    }

    /* Filters */
    .control-panel {
      background: var(--surface-dim);
      border-radius: var(--r-m);
      padding: var(--sp-m);
      display: flex;
      flex-direction: column;
      gap: var(--sp-m);
    }
    .chip-group { display: flex; flex-wrap: wrap; gap: var(--sp-xs); }
    .chip {
      border: 1px solid var(--stroke);
      background: var(--surface);
      border-radius: var(--r-full);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .chip:hover { background: var(--surface-hover); }
    .chip.is-active { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    .filter-row { display: flex; flex-wrap: wrap; gap: var(--sp-s); }
    .search-input {
      flex: 1 1 220px;
      min-width: 0;
      padding: 8px 14px;
      border-radius: var(--r-full);
      border: 1px solid var(--stroke);
      background: var(--surface);
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .select {
      flex: 0 1 170px;
      min-width: 0;
      padding: 8px 12px;
      border-radius: var(--r-full);
      border: 1px solid var(--stroke);
      background: var(--surface);
    }

    /* Module cards */
    .modules-list { display: flex; flex-direction: column; gap: var(--sp-s); }
    .module-card {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: var(--r-m);
      overflow: hidden;
      transition: border-color 0.15s ease;
    }
    .module-card.is-expanded { border-color: var(--primary); }
    .module-header {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: var(--sp-m) var(--sp-l);
      display: flex;
      align-items: center;
      gap: var(--sp-m);
      transition: background-color 0.15s ease;
    }
    .module-header:hover { background: var(--surface-hover); }
    .module-title-block { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .module-title { font-size: 15px; font-weight: 540; }
    .module-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-s); font-size: 12px; }
    .domain-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--r-full);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--dc);
      background: color-mix(in srgb, var(--dc) 15%, transparent);
    }
    .domain-networking { --dc: var(--c-networking); }
    .domain-cloud { --dc: var(--c-cloud); }
    .domain-security { --dc: var(--c-security); }
    .muted-mono { font-family: var(--ff-mono); color: var(--text-2); }
    .status { font-weight: 600; }
    .status-passed { color: var(--positive); }
    .status-retry { color: var(--error); }
    .status-progress { color: var(--warning); }
    .dots { display: inline-flex; gap: 3px; }
    .dots i {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--surface-dim);
      border: 1px solid var(--stroke);
    }
    .dots i.ok { background: var(--positive); border-color: var(--positive); }
    .dots i.bad { background: var(--error); border-color: var(--error); }
    .chevron { color: var(--text-2); font-size: 12px; transition: transform 0.2s ease; }
    .is-expanded .chevron { transform: rotate(180deg); }

    .module-body {
      border-top: 1px solid var(--stroke);
      padding: var(--sp-m) var(--sp-l) var(--sp-l);
      display: flex;
      flex-direction: column;
      gap: var(--sp-m);
    }
    .module-desc { margin: 0; color: var(--text-2); }

    /* Quiz */
    .quiz-box {
      background: var(--surface-dim);
      border: 1px solid var(--stroke);
      border-radius: var(--r-m);
      padding: var(--sp-l);
      display: flex;
      flex-direction: column;
      gap: var(--sp-m);
    }
    .stepper { display: flex; align-items: center; gap: var(--sp-xs); flex-wrap: wrap; }
    .step {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid var(--stroke);
      background: var(--surface);
      font-family: var(--ff-mono);
      font-size: 13px;
      font-weight: 600;
    }
    .step.is-current { border: 2px solid var(--primary); }
    .step.ok { background: var(--positive-soft); border-color: var(--positive); color: var(--positive); }
    .step.bad { background: var(--error-soft); border-color: var(--error); color: var(--error); }
    .step.is-current.ok, .step.is-current.bad { box-shadow: 0 0 0 2px var(--primary); }
    .step-label { margin-left: auto; font-size: 12px; color: var(--text-2); }
    .q-type {
      align-self: flex-start;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 2px 10px;
      border-radius: var(--r-full);
    }
    .q-text { margin: 0; font-size: 16px; font-weight: 540; }

    .options { display: flex; flex-direction: column; gap: 6px; }
    .options.tf { flex-direction: row; }
    .options.tf .option { flex: 1; justify-content: center; }
    .option {
      display: flex;
      align-items: center;
      gap: var(--sp-s);
      width: 100%;
      text-align: left;
      padding: 10px var(--sp-m);
      border: 1px solid var(--stroke);
      border-radius: var(--r-s);
      background: var(--surface);
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .option:hover:not(:disabled) { border-color: var(--primary); background: var(--surface-hover); }
    .option .mark {
      flex: 0 0 auto;
      width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--stroke);
      font-family: var(--ff-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      background: var(--surface-dim);
    }
    .option .mark.radio { border-radius: 50%; }
    .option .mark.box { border-radius: 5px; }
    .option .opt-text { flex: 1; }
    .option .verdict { font-weight: 700; }
    .option.is-selected { border-color: var(--primary); background: var(--primary-soft); }
    .option.is-selected .mark { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    .option.is-correct { border-color: var(--positive); background: var(--positive-soft); }
    .option.is-correct .mark { background: var(--positive); border-color: var(--positive); color: #fff; }
    .option.is-wrong { border-color: var(--error); background: var(--error-soft); }
    .option.is-wrong .mark { background: var(--error); border-color: var(--error); color: #fff; }
    .option.is-missed { border-color: var(--positive); border-style: dashed; }
    .option:disabled { color: var(--text); }

    .fill-input {
      width: 100%;
      padding: 10px var(--sp-m);
      border-radius: var(--r-s);
      border: 1px solid var(--stroke);
      background: var(--surface);
      font-family: var(--ff-mono);
      font-size: 15px;
      outline: none;
    }
    .fill-input:focus { border-color: var(--primary); }
    .fill-input.is-correct { border-color: var(--positive); background: var(--positive-soft); }
    .fill-input.is-wrong { border-color: var(--error); background: var(--error-soft); }
    .hint { font-size: 12px; color: var(--text-2); margin: 0; }

    .order-list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .order-item {
      display: flex;
      align-items: center;
      gap: var(--sp-s);
      padding: 8px var(--sp-s) 8px var(--sp-m);
      border: 1px solid var(--stroke);
      border-radius: var(--r-s);
      background: var(--surface);
    }
    .order-item.is-correct { border-color: var(--positive); background: var(--positive-soft); }
    .order-item.is-wrong { border-color: var(--error); background: var(--error-soft); }
    .order-num { font-family: var(--ff-mono); font-weight: 600; color: var(--text-2); width: 18px; }
    .order-text { flex: 1; }
    .icon-btn {
      width: 30px; height: 30px;
      border: 1px solid var(--stroke);
      border-radius: var(--r-s);
      background: var(--surface-dim);
      font-size: 13px;
      line-height: 1;
    }
    .icon-btn:hover:not(:disabled) { border-color: var(--primary); }
    .icon-btn:disabled { opacity: 0.35; }

    .match-list { display: flex; flex-direction: column; gap: 6px; }
    .match-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
      gap: var(--sp-s);
      align-items: center;
      padding: 8px var(--sp-m);
      border: 1px solid var(--stroke);
      border-radius: var(--r-s);
      background: var(--surface);
    }
    .match-row.is-correct { border-color: var(--positive); background: var(--positive-soft); }
    .match-row.is-wrong { border-color: var(--error); background: var(--error-soft); }
    .match-left { font-weight: 540; }
    .match-row select {
      width: 100%;
      padding: 7px 10px;
      border-radius: var(--r-s);
      border: 1px solid var(--stroke);
      background: var(--surface);
    }
    .match-fix { grid-column: 1 / -1; font-size: 12px; color: var(--positive); font-weight: 600; }

    .feedback {
      border-radius: var(--r-s);
      padding: 10px var(--sp-m);
      font-size: 13px;
      border: 1px solid;
    }
    .feedback.ok { background: var(--positive-soft); border-color: var(--positive); }
    .feedback.bad { background: var(--error-soft); border-color: var(--error); }
    .feedback strong { display: block; margin-bottom: 2px; }
    .feedback.ok strong { color: var(--positive); }
    .feedback.bad strong { color: var(--error); }

    .actions { display: flex; align-items: center; gap: var(--sp-s); flex-wrap: wrap; }
    .actions .spacer { flex: 1; }
    .btn {
      border: 1px solid transparent;
      border-radius: var(--r-full);
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.05); }
    .btn-tonal { background: var(--surface); border-color: var(--stroke); }
    .btn-tonal:hover:not(:disabled) { background: var(--surface-hover); }
    .btn-text { background: transparent; color: var(--primary); padding-inline: 10px; }
    .btn:disabled { opacity: 0.4; }

    .summary { display: flex; flex-direction: column; gap: var(--sp-m); align-items: flex-start; }
    .summary-score { font-size: 32px; font-weight: 500; font-family: var(--ff-mono); }
    .summary-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .summary-list li { display: flex; gap: var(--sp-s); font-size: 13px; }
    .summary-list .ok { color: var(--positive); font-weight: 700; }
    .summary-list .bad { color: var(--error); font-weight: 700; }

    .pagination-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-m); }
    .empty-state {
      padding: var(--sp-xxl);
      text-align: center;
      background: var(--surface-dim);
      border-radius: var(--r-m);
      color: var(--text-2);
    }
    .empty-state p { margin: 0; }
    .empty-state p:first-child { color: var(--text); font-weight: 540; margin-bottom: 4px; }

    @media (max-width: 560px) {
      .app { padding: var(--sp-l) var(--sp-l); }
      .match-row { grid-template-columns: 1fr; }
      .options.tf { flex-direction: column; }
      .module-header { padding: var(--sp-m); }
      .module-body { padding: var(--sp-m); }
      .quiz-box { padding: var(--sp-m); }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header-card">
      <div class="header-top">
        <div>
          <h1>Curriculum Explorer</h1>
          <p>Interactive module directory &amp; knowledge assessment</p>
        </div>
        <div class="pill-row">
          <span class="pill">Modules passed <b id="modules-passed">0/33</b></span>
          <span class="pill">Questions correct <b id="questions-correct">0/0</b></span>
          <button class="btn btn-text" id="reset-all" type="button">Reset progress</button>
        </div>
      </div>
      <div class="overall-bar" aria-hidden="true"><span id="overall-fill"></span></div>
      <div class="legend" id="type-legend"></div>
    </section>

    <section class="control-panel">
      <div class="chip-group" id="domain-chips">
        <button class="chip is-active" data-domain="All" type="button">All Domains</button>
        <button class="chip" data-domain="Networking" type="button">Networking</button>
        <button class="chip" data-domain="Cloud" type="button">Cloud</button>
        <button class="chip" data-domain="Security" type="button">Security</button>
      </div>
      <div class="filter-row">
        <input type="search" id="search-input" class="search-input" placeholder="Search module title or topic..." aria-label="Search modules">
        <select id="difficulty-select" class="select" aria-label="Difficulty">
          <option value="All">All Difficulties</option>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
        <select id="status-select" class="select" aria-label="Progress status">
          <option value="All">All Statuses</option>
          <option value="new">Not started</option>
          <option value="progress">In progress</option>
          <option value="passed">Passed</option>
          <option value="retry">Needs retry</option>
        </select>
      </div>
    </section>

    <section class="modules-list" id="modules-list" aria-live="polite"></section>

    <nav class="pagination-bar">
      <button class="btn btn-tonal" id="prev-btn" type="button">Previous</button>
      <span id="page-info">Page 1 of 1</span>
      <button class="btn btn-tonal" id="next-btn" type="button">Next</button>
    </nav>
  </main>

  <script>
    // Question builders. Types: mcq, tf, multi, fill, order, match
    const mcq = (q, o, a) => ({ t: "mcq", q, o, a });
    const tf = (q, a) => ({ t: "tf", q, a });
    const multi = (q, o, a) => ({ t: "multi", q, o, a });
    const fill = (q, a) => ({ t: "fill", q, a });
    const order = (q, o) => ({ t: "order", q, o });
    const match = (q, p) => ({ t: "match", q, p });

    const TYPE_LABEL = {
      mcq: "Multiple choice",
      tf: "True / False",
      multi: "Multiple select",
      fill: "Fill in the blank",
      order: "Put in order",
      match: "Match the pairs"
    };
    const TYPE_HINT = {
      mcq: "Choose one answer.",
      tf: "Decide whether the statement is true or false.",
      multi: "Select all answers that apply.",
      fill: "Type your answer, then press Enter or Check answer.",
      order: "Use the arrows to move items into the correct order.",
      match: "Pick the matching item for each row."
    };

    // Module Dataset (33 modules: 1-10 Networking, 11-20 Cloud, 21-33 Security)
    const MODULES_DATA = [
      // NETWORKING (1-10)
      { id: 1, title: "Module 1: OSI & TCP/IP Model Foundations", domain: "Networking", difficulty: "Beginner",
        description: "Understand the core 7-layer OSI model and 4-layer TCP/IP suite that power modern data communication.",
        qs: [
          mcq("Which OSI layer is responsible for logical IP addressing and packet routing?", ["Data Link (Layer 2)", "Network (Layer 3)", "Transport (Layer 4)", "Session (Layer 5)"], 1),
          tf("The TCP/IP model has 4 layers, while the OSI model has 7.", true),
          order("Arrange the OSI layers from Layer 1 (bottom) to Layer 7 (top).", ["Physical", "Data Link", "Network", "Transport", "Session", "Presentation", "Application"]),
          match("Match each protocol to its OSI layer.", [["HTTP", "Application"], ["TCP", "Transport"], ["IP", "Network"], ["Ethernet", "Data Link"]])
        ] },
      { id: 2, title: "Module 2: IPv4 & IPv6 Subnetting Mechanics", domain: "Networking", difficulty: "Intermediate",
        description: "Master CIDR notation, variable-length subnet masking (VLSM), and IPv6 prefix aggregation.",
        qs: [
          mcq("How many usable host IP addresses are provided by a /28 IPv4 subnet?", ["14", "16", "30", "62"], 0),
          fill("The subnet mask 255.255.255.0 written in CIDR notation is /___ .", ["24", "/24"]),
          tf("A /30 subnet provides exactly 2 usable host addresses.", true),
          multi("Which prefixes can hold at least 50 usable hosts?", ["/24", "/26", "/27", "/28"], [0, 1])
        ] },
      { id: 3, title: "Module 3: Ethernet Switching & VLAN Segmentation", domain: "Networking", difficulty: "Beginner",
        description: "Explore Layer 2 MAC switching operations, 802.1Q trunking protocols, and VLAN isolation principles.",
        qs: [
          mcq("Which protocol prevents switching loops in redundant Layer 2 topology network layouts?", ["OSPF", "STP (Spanning Tree)", "BGP", "ARP"], 1),
          fill("The IEEE standard for VLAN tagging on trunk links is 802.___ .", ["1q"]),
          tf("Switches forward frames based on the destination MAC address.", true),
          match("Match each switching concept to what it does.", [["Access port", "Carries a single VLAN"], ["Trunk port", "Carries multiple tagged VLANs"], ["MAC address table", "Maps MAC addresses to ports"], ["Spanning Tree", "Blocks redundant paths"]])
        ] },
      { id: 4, title: "Module 4: Dynamic Routing with OSPF & BGP", domain: "Networking", difficulty: "Advanced",
        description: "Compare interior link-state routing (OSPF) with exterior path-vector routing (BGP) across autonomous systems.",
        qs: [

    const PASS_RATIO = 0.75;
    const STORAGE_KEY = "curriculum-explorer-v2";
    const TOTAL_QUESTIONS = MODULES_DATA.reduce((n, m) => n + m.qs.length, 0);
    const byId = new Map(MODULES_DATA.map(m => [m.id, m]));

    // Reactive State
    const state = {
      domainFilter: "All",
      difficultyFilter: "All",
      statusFilter: "All",
      searchQuery: "",
      currentPage: 1,
      itemsPerPage: 8,
      expandedModuleId: null
    };
    // moduleId -> { qi, view: "quiz" | "summary", resp: {qIdx: response}, res: {qIdx: true|false} }
    let progress = loadProgress();

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (e) { return {}; }
    }
    function saveProgress() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
    }

    // Deterministic shuffle so order/match layouts stay stable between renders
    function seededPerm(n, seed) {
      let s = seed >>> 0;
      const rand = () => {
        s = (s + 0x6D2B79F5) >>> 0;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const p = [...Array(n).keys()];
      for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [p[i], p[j]] = [p[j], p[i]];
      }
      if (n > 1 && p.every((v, i) => v === i)) p.push(p.shift());
      return p;
    }

    function getProg(id) {
      if (!progress[id]) progress[id] = { qi: 0, view: "quiz", resp: {}, res: {} };
      return progress[id];
    }

    function getResp(m, qi) {
      const p = getProg(m.id);
      if (p.resp[qi] !== undefined) return p.resp[qi];
      const q = m.qs[qi];
      if (q.t === "multi") return [];
      if (q.t === "order") return seededPerm(q.o.length, m.id * 97 + qi * 13 + 1);
      if (q.t === "match") return q.p.map(() => -1);
      if (q.t === "fill") return "";
      return null;
    }

    const norm = s => String(s).toLowerCase().replace(/\s+/g, " ").trim();

    function isAnswered(q, r) {
      switch (q.t) {
        case "mcq": return r !== null && r !== undefined;
        case "tf": return typeof r === "boolean";
        case "multi": return Array.isArray(r) && r.length > 0;
        case "fill": return typeof r === "string" && r.trim() !== "";
        case "order": return Array.isArray(r);
        case "match": return Array.isArray(r) && r.every(x => x >= 0);
      }
      return false;
    }

    function grade(q, r) {
      switch (q.t) {
        case "mcq": return r === q.a;
        case "tf": return r === q.a;
        case "multi": return r.length === q.a.length && q.a.every(i => r.includes(i));
        case "fill": return q.a.some(ans => norm(ans) === norm(r));
        case "order": return r.every((v, i) => v === i);
        case "match": return r.every((v, i) => v === i);
      }
      return false;
    }

    function correctAnswerText(q) {
      switch (q.t) {
        case "mcq": return q.o[q.a];
        case "tf": return q.a ? "True" : "False";
        case "multi": return q.a.map(i => q.o[i]).join(", ");
        case "fill": return q.a[0];
        case "order": return q.o.join(" → ");
        case "match": return q.p.map(([l, r]) => `${l} → ${r}`).join("; ");
      }
      return "";
    }

    function moduleStats(m) {
      const p = progress[m.id];
      const res = p ? p.res : {};
      const checked = Object.keys(res).length;
      const correct = Object.values(res).filter(Boolean).length;
      let status = "new";
      if (checked > 0) status = "progress";
      if (checked === m.qs.length) status = correct >= Math.ceil(m.qs.length * PASS_RATIO) ? "passed" : "retry";
      return { checked, correct, status };
    }

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // DOM Elements
    const modulesListEl = document.getElementById("modules-list");
    const domainChipsEl = document.getElementById("domain-chips");
    const difficultySelectEl = document.getElementById("difficulty-select");
    const statusSelectEl = document.getElementById("status-select");
    const searchInputEl = document.getElementById("search-input");
    const prevBtnEl = document.getElementById("prev-btn");
    const nextBtnEl = document.getElementById("next-btn");
    const pageInfoEl = document.getElementById("page-info");

    function filteredModules() {
      const query = norm(state.searchQuery);
      return MODULES_DATA.filter(m => {
        const matchDomain = state.domainFilter === "All" || m.domain === state.domainFilter;
        const matchDifficulty = state.difficultyFilter === "All" || m.difficulty === state.difficultyFilter;
        const matchStatus = state.statusFilter === "All" || moduleStats(m).status === state.statusFilter;
        const matchQuery = !query || norm(m.title).includes(query) || norm(m.description).includes(query);
        return matchDomain && matchDifficulty && matchStatus && matchQuery;
      });
    }

    function renderHeader() {
      let passed = 0, correct = 0;
      MODULES_DATA.forEach(m => {
        const s = moduleStats(m);
        if (s.status === "passed") passed++;
        correct += s.correct;
      });
      document.getElementById("modules-passed").textContent = `${passed}/${MODULES_DATA.length}`;
      document.getElementById("questions-correct").textContent = `${correct}/${TOTAL_QUESTIONS}`;
      document.getElementById("overall-fill").style.width = `${(correct / TOTAL_QUESTIONS) * 100}%`;
    }

    function renderLegend() {
      const counts = {};
      MODULES_DATA.forEach(m => m.qs.forEach(q => { counts[q.t] = (counts[q.t] || 0) + 1; }));
      document.getElementById("type-legend").innerHTML = Object.keys(TYPE_LABEL)
        .map(t => `<span class="type-tag">${TYPE_LABEL[t]} · ${counts[t] || 0}</span>`).join("");
    }

    function headerHTML(m) {
      const s = moduleStats(m);
      const p = progress[m.id];
      const isExpanded = state.expandedModuleId === m.id;
      const statusText = {
        new: "",
        progress: `<span class="status status-progress">${s.correct}/${m.qs.length} correct · in progress</span>`,
        passed: `<span class="status status-passed">Passed ${s.correct}/${m.qs.length}</span>`,
        retry: `<span class="status status-retry">Retry ${s.correct}/${m.qs.length}</span>`
      }[s.status];
      const dots = m.qs.map((_, i) => {
        const r = p && p.res[i];
        return `<i class="${r === true ? "ok" : r === false ? "bad" : ""}"></i>`;
      }).join("");
      return `
        <button class="module-header" type="button" data-action="toggle" aria-expanded="${isExpanded}">
          <span class="module-title-block">
            <span class="module-title">${esc(m.title)}</span>
            <span class="module-meta">
              <span class="domain-badge domain-${m.domain.toLowerCase()}">${m.domain}</span>
              <span class="muted-mono">${m.difficulty}</span>
              <span class="muted-mono">${m.qs.length} questions</span>
              <span class="dots" aria-hidden="true">${dots}</span>
              ${statusText}
            </span>
          </span>
          <span class="chevron" aria-hidden="true">&#9660;</span>
        </button>`;
    }

    function questionInputHTML(m, qi) {
      const q = m.qs[qi];
      const p = getProg(m.id);
      const r = getResp(m, qi);
      const checked = p.res[qi] !== undefined;
      const dis = checked ? "disabled" : "";

      if (q.t === "mcq" || q.t === "tf") {
        const opts = q.t === "tf" ? [["True", true], ["False", false]] : q.o.map((o, i) => [o, i]);
        const answer = q.a;
        return `<div class="options ${q.t === "tf" ? "tf" : ""}" role="radiogroup">${opts.map(([label, val], i) => {
          let cls = r === val ? "is-selected" : "";
          let verdict = "";
          if (checked) {
            cls = val === answer ? "is-correct" : (r === val ? "is-wrong" : "");
            verdict = val === answer ? "&#10004;" : (r === val ? "&#10008;" : "");
          }
          const mark = q.t === "tf" ? (val ? "T" : "F") : String.fromCharCode(65 + i);
          return `<button type="button" class="option ${cls}" role="radio" aria-checked="${r === val}" data-action="pick" data-v="${String(val)}" ${dis}>
              <span class="mark radio">${mark}</span><span class="opt-text">${esc(label)}</span><span class="verdict">${verdict}</span>
            </button>`;
        }).join("")}</div>`;
      }

      if (q.t === "multi") {
        return `<div class="options">${q.o.map((o, i) => {
          const sel = r.includes(i);
          const isAns = q.a.includes(i);
          let cls = sel ? "is-selected" : "";
          let verdict = "";
          if (checked) {
            if (isAns && sel) { cls = "is-correct"; verdict = "&#10004;"; }
            else if (isAns) { cls = "is-missed"; verdict = "missed"; }
            else if (sel) { cls = "is-wrong"; verdict = "&#10008;"; }
            else cls = "";
          }
          return `<button type="button" class="option ${cls}" role="checkbox" aria-checked="${sel}" data-action="toggle-multi" data-v="${i}" ${dis}>
              <span class="mark box">${sel ? "&#10003;" : ""}</span><span class="opt-text">${esc(o)}</span><span class="verdict">${verdict}</span>
            </button>`;
        }).join("")}</div>`;
      }

      if (q.t === "fill") {
        const cls = checked ? (p.res[qi] ? "is-correct" : "is-wrong") : "";
        return `<input type="text" class="fill-input ${cls}" data-role="fill" value="${esc(r)}" placeholder="Type your answer" autocomplete="off" spellcheck="false" ${dis}>
          <p class="hint">Not case-sensitive.</p>`;
      }

      if (q.t === "order") {
        return `<ol class="order-list">${r.map((itemIdx, pos) => {
          const cls = checked ? (itemIdx === pos ? "is-correct" : "is-wrong") : "";
          return `<li class="order-item ${cls}">
              <span class="order-num">${pos + 1}</span>
              <span class="order-text">${esc(q.o[itemIdx])}</span>
              <button type="button" class="icon-btn" data-action="move" data-pos="${pos}" data-dir="-1" aria-label="Move up" ${checked || pos === 0 ? "disabled" : ""}>&#9650;</button>
              <button type="button" class="icon-btn" data-action="move" data-pos="${pos}" data-dir="1" aria-label="Move down" ${checked || pos === r.length - 1 ? "disabled" : ""}>&#9660;</button>
            </li>`;
        }).join("")}</ol>`;
      }

      if (q.t === "match") {
        const perm = seededPerm(q.p.length, m.id * 131 + qi * 7 + 3);
        return `<div class="match-list">${q.p.map(([left], row) => {
          const cls = checked ? (r[row] === row ? "is-correct" : "is-wrong") : "";
          const options = perm.map(j => `<option value="${j}" ${r[row] === j ? "selected" : ""}>${esc(q.p[j][1])}</option>`).join("");
          const fix = checked && r[row] !== row ? `<span class="match-fix">Correct: ${esc(q.p[row][1])}</span>` : "";
          return `<div class="match-row ${cls}">
              <span class="match-left">${esc(left)}</span>
              <select data-role="match" data-row="${row}" aria-label="Match for ${esc(left)}" ${dis}>
                <option value="-1" ${r[row] < 0 ? "selected" : ""}>Choose…</option>${options}
              </select>
              ${fix}
            </div>`;
        }).join("")}</div>`;
      }
      return "";
    }

    function quizHTML(m) {
      const p = getProg(m.id);
      if (p.qi >= m.qs.length || p.qi < 0) p.qi = 0;
      const qi = p.qi;
      const q = m.qs[qi];
      const r = getResp(m, qi);
      const checked = p.res[qi] !== undefined;
      const isLast = qi === m.qs.length - 1;

      const steps = m.qs.map((_, i) => {
        const res = p.res[i];
        const cls = [i === qi ? "is-current" : "", res === true ? "ok" : res === false ? "bad" : ""].join(" ");
        return `<button type="button" class="step ${cls}" data-action="goto" data-q="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`;
      }).join("");

      let feedback = "";
      if (checked) {
        feedback = p.res[qi]
          ? `<div class="feedback ok"><strong>Correct!</strong>Nice work. ${isLast ? "Finish to see your module result." : "Move on to the next question."}</div>`
          : `<div class="feedback bad"><strong>Not quite.</strong>Correct answer: ${esc(correctAnswerText(q))}</div>`;
      }

      const primary = !checked
        ? `<button type="button" class="btn btn-primary" data-action="check" ${isAnswered(q, r) ? "" : "disabled"}>Check answer</button>`
        : isLast
          ? `<button type="button" class="btn btn-primary" data-action="finish">See results</button>`
          : `<button type="button" class="btn btn-primary" data-action="next-q">Next question</button>`;

      return `
        <div class="quiz-box">
          <div class="stepper">${steps}<span class="step-label">Question ${qi + 1} of ${m.qs.length}</span></div>
          <span class="q-type">${TYPE_LABEL[q.t]}</span>
          <p class="q-text">${esc(q.q)}</p>
          <p class="hint">${TYPE_HINT[q.t]}</p>
          ${questionInputHTML(m, qi)}
          ${feedback}
          <div class="actions">
            <button type="button" class="btn btn-tonal" data-action="prev-q" ${qi === 0 ? "disabled" : ""}>Previous</button>
            ${checked && !p.res[qi] ? `<button type="button" class="btn btn-text" data-action="retry-q">Try again</button>` : ""}
            <span class="spacer"></span>
            ${!checked && !isLast ? `<button type="button" class="btn btn-text" data-action="next-q">Skip</button>` : ""}
            ${primary}
          </div>
        </div>`;
    }

    function summaryHTML(m) {
      const p = getProg(m.id);
      const s = moduleStats(m);
      const need = Math.ceil(m.qs.length * PASS_RATIO);
      const unanswered = m.qs.length - s.checked;
      const verdict = s.status === "passed"
        ? `<div class="feedback ok"><strong>Module passed</strong>You answered ${s.correct} of ${m.qs.length} correctly.</div>`
        : unanswered > 0
          ? `<div class="feedback bad"><strong>${unanswered} question${unanswered > 1 ? "s" : ""} still unanswered</strong>Answer every question to complete the module (${need} correct needed to pass).</div>`
          : `<div class="feedback bad"><strong>Not passed yet</strong>You need ${need} of ${m.qs.length} correct. Review the misses and try again.</div>`;
      const list = m.qs.map((q, i) => {
        const r = p.res[i];
        const mark = r === true ? `<span class="ok">&#10004;</span>` : r === false ? `<span class="bad">&#10008;</span>` : `<span>–</span>`;
        return `<li>${mark}<span>Q${i + 1} · ${TYPE_LABEL[q.t]} — ${esc(q.q)}</span></li>`;
      }).join("");
      return `
        <div class="quiz-box summary">
          <span class="summary-score">${s.correct}/${m.qs.length}</span>
          ${verdict}
          <ul class="summary-list">${list}</ul>
          <div class="actions">
            <button type="button" class="btn btn-tonal" data-action="review">Review answers</button>
            <button type="button" class="btn btn-text" data-action="retry-module">Retry module</button>
            <button type="button" class="btn btn-primary" data-action="next-module">Next module</button>
          </div>
        </div>`;
    }

    function bodyHTML(m) {
      const p = getProg(m.id);
      return `
        <div class="module-body">
          <p class="module-desc">${esc(m.description)}</p>
          ${p.view === "summary" ? summaryHTML(m) : quizHTML(m)}
        </div>`;
    }

    function cardHTML(m) {
      const isExpanded = state.expandedModuleId === m.id;
      return `<article class="module-card ${isExpanded ? "is-expanded" : ""}" data-id="${m.id}">
          ${headerHTML(m)}
          ${isExpanded ? bodyHTML(m) : ""}
        </article>`;
    }

    // Re-render only one card (keeps focus/scroll position stable while answering)
    function renderCard(id, focusSelector) {
      const card = modulesListEl.querySelector(`.module-card[data-id="${id}"]`);
      const m = byId.get(id);
      if (!card || !m) return renderList();
      const wrapper = document.createElement("div");
      wrapper.innerHTML = cardHTML(m);
      const fresh = wrapper.firstElementChild;
      card.replaceWith(fresh);
      renderHeader();
      if (focusSelector) {
        const el = fresh.querySelector(focusSelector);
        if (el) el.focus();
      }
    }

    function renderList() {
      const filtered = filteredModules();
      const totalPages = Math.max(1, Math.ceil(filtered.length / state.itemsPerPage));
      if (state.currentPage > totalPages) state.currentPage = totalPages;
      const start = (state.currentPage - 1) * state.itemsPerPage;
      const pageItems = filtered.slice(start, start + state.itemsPerPage);

      modulesListEl.innerHTML = pageItems.length
        ? pageItems.map(cardHTML).join("")
        : `<div class="empty-state"><p>No modules match your current filters.</p><p>Try adjusting your domain, difficulty, status or search term.</p></div>`;

      pageInfoEl.textContent = `Page ${state.currentPage} of ${totalPages}`;
      prevBtnEl.disabled = state.currentPage <= 1;
      nextBtnEl.disabled = state.currentPage >= totalPages;
      renderHeader();
    }

    function openModule(id) {
      const filtered = filteredModules();
      const idx = filtered.findIndex(m => m.id === id);
      if (idx >= 0) state.currentPage = Math.floor(idx / state.itemsPerPage) + 1;
      state.expandedModuleId = id;
      renderList();
      const card = modulesListEl.querySelector(`.module-card[data-id="${id}"]`);
      if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function setResp(m, qi, value) {
      getProg(m.id).resp[qi] = value;
      saveProgress();
    }

    function checkAnswer(m) {
      const p = getProg(m.id);
      const q = m.qs[p.qi];
      const r = getResp(m, p.qi);
      if (!isAnswered(q, r)) return;
      p.resp[p.qi] = r;
      p.res[p.qi] = grade(q, r);
      saveProgress();
    }

    // Event delegation for everything inside module cards
    modulesListEl.addEventListener("click", e => {
      const btn = e.target.closest("[data-action]");
      if (!btn || btn.disabled) return;
      const card = btn.closest(".module-card");
      if (!card) return;
      const id = Number(card.dataset.id);
      const m = byId.get(id);
      const p = getProg(id);
      const action = btn.dataset.action;

      switch (action) {
        case "toggle":
          state.expandedModuleId = state.expandedModuleId === id ? null : id;
          renderCard(id);
          // collapse any other open card
          modulesListEl.querySelectorAll(".module-card.is-expanded").forEach(c => {
            if (Number(c.dataset.id) !== state.expandedModuleId) renderCard(Number(c.dataset.id));
          });
          return;
        case "pick": {
          const q = m.qs[p.qi];
          setResp(m, p.qi, q.t === "tf" ? btn.dataset.v === "true" : Number(btn.dataset.v));
          break;
        }
        case "toggle-multi": {
          const v = Number(btn.dataset.v);
          const r = [...getResp(m, p.qi)];
          const at = r.indexOf(v);
          if (at >= 0) r.splice(at, 1); else r.push(v);
          setResp(m, p.qi, r);
          break;
        }
        case "move": {
          const pos = Number(btn.dataset.pos), dir = Number(btn.dataset.dir);
          const r = [...getResp(m, p.qi)];
          const to = pos + dir;
          if (to < 0 || to >= r.length) return;
          [r[pos], r[to]] = [r[to], r[pos]];
          setResp(m, p.qi, r);
          renderCard(id, `[data-action="move"][data-pos="${to}"][data-dir="${dir}"]:not(:disabled)`);
          return;
        }
        case "check":
          checkAnswer(m);
          renderCard(id, `[data-action="next-q"].btn-primary, [data-action="finish"], [data-action="retry-q"]`);
          return;
        case "retry-q":
          delete p.res[p.qi];
          delete p.resp[p.qi];
          saveProgress();
          break;
        case "next-q":
          if (p.qi < m.qs.length - 1) p.qi++;
          saveProgress();
          break;
        case "prev-q":
          if (p.qi > 0) p.qi--;
          saveProgress();
          break;
        case "goto":
          p.qi = Number(btn.dataset.q);
          p.view = "quiz";
          saveProgress();
          break;
        case "finish":
          p.view = "summary";
          saveProgress();
          break;
        case "review":
          p.view = "quiz";
          p.qi = 0;
          saveProgress();
          break;
        case "retry-module":
          progress[id] = { qi: 0, view: "quiz", resp: {}, res: {} };
          saveProgress();
          break;
        case "next-module": {
          const list = filteredModules();
          const idx = list.findIndex(x => x.id === id);
          const next = list[idx + 1] || list[0];
          if (next && next.id !== id) { openModule(next.id); return; }
          break;
        }
        default:
          return;
      }
      renderCard(id);
    });

    // Typed answers (fill) and dropdown answers (match) update without re-rendering mid-typing
    modulesListEl.addEventListener("input", e => {
      const el = e.target;
      if (el.dataset.role !== "fill") return;
      const card = el.closest(".module-card");
      const m = byId.get(Number(card.dataset.id));
      const p = getProg(m.id);
      setResp(m, p.qi, el.value);
      const checkBtn = card.querySelector('[data-action="check"]');
      if (checkBtn) checkBtn.disabled = el.value.trim() === "";
    });

    modulesListEl.addEventListener("keydown", e => {
      const el = e.target;
      if (el.dataset.role === "fill" && e.key === "Enter") {
        e.preventDefault();
        const checkBtn = el.closest(".module-card").querySelector('[data-action="check"]');
        if (checkBtn && !checkBtn.disabled) checkBtn.click();
      }
    });

    modulesListEl.addEventListener("change", e => {
      const el = e.target;
      if (el.dataset.role !== "match") return;
      const card = el.closest(".module-card");
      const m = byId.get(Number(card.dataset.id));
      const p = getProg(m.id);
      const r = [...getResp(m, p.qi)];
      r[Number(el.dataset.row)] = Number(el.value);
      setResp(m, p.qi, r);
      const checkBtn = card.querySelector('[data-action="check"]');
      if (checkBtn) checkBtn.disabled = !isAnswered(m.qs[p.qi], r);
    });

    // Filter Listeners
    domainChipsEl.addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      domainChipsEl.querySelectorAll(".chip").forEach(c => c.classList.toggle("is-active", c === chip));
      state.domainFilter = chip.dataset.domain;
      state.currentPage = 1;
      renderList();
    });
    difficultySelectEl.addEventListener("change", e => {
      state.difficultyFilter = e.target.value;
      state.currentPage = 1;
      renderList();
    });
    statusSelectEl.addEventListener("change", e => {
      state.statusFilter = e.target.value;
      state.currentPage = 1;
      renderList();
    });
    searchInputEl.addEventListener("input", e => {
      state.searchQuery = e.target.value;
      state.currentPage = 1;
      renderList();
    });
    prevBtnEl.addEventListener("click", () => {
      if (state.currentPage > 1) { state.currentPage--; renderList(); }
    });
    nextBtnEl.addEventListener("click", () => {
      state.currentPage++;
      renderList();
    });
    document.getElementById("reset-all").addEventListener("click", () => {
      if (!confirm("Reset all quiz progress?")) return;
      progress = {};
      saveProgress();
      renderList();
    });

    // Initial Load
    renderLegend();
    renderList();
  </script>
</body>
</html>
