<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MND CODE Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="MND CODE — practical training in computer networking, cloud computing, cybersecurity and authorized penetration testing. Connect. Compute. Secure.">
<meta property="og:title" content="MND CODE — Networking, Cloud & Cybersecurity Academy">
<meta property="og:description" content="Build your future in networking, cloud and cybersecurity with structured lessons, browser labs and guided projects.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mndcode.in/">
<meta name="theme-color" content="#070A12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: editorial dark "network operations" academy — 1200px column, bento grids, glass panes over a faint node grid; one light paper band for depth */
:root{
  --bg:#070A12; --surface:#101625; --surface-2:#151D31; --surface-3:#1B2540;
  --line:rgba(148,163,184,.13); --line-2:rgba(148,163,184,.24);
  --blue:#3B82F6; --cyan:#22D3EE; --purple:#8B5CF6;
  --text:#F8FAFC; --muted:#94A3B8; --dim:#64748B;
  --ok:#22C55E; --warn:#F59E0B; --bad:#F43F5E;
  --paper:#EEF2F8; --ink:#0B1220; --ink-2:#475569;
  --f-display:'Space Grotesk',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  --f-body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px; --wrap:1200px;
  --t-xs:.75rem; --t-sm:.875rem; --t-base:1rem; --t-md:1.125rem; --t-lg:1.375rem; --t-xl:1.875rem; --t-2xl:clamp(2rem,4vw,2.75rem); --t-hero:clamp(2.3rem,5.6vw,4.1rem);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:var(--t-base);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.bg-grid{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(900px 500px at 85% -10%,rgba(59,130,246,.16),transparent 60%),
   radial-gradient(700px 420px at -10% 20%,rgba(139,92,246,.10),transparent 60%),
   linear-gradient(var(--bg),var(--bg));}
.bg-grid::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.045) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(to bottom,#000 0%,transparent 75%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 75%)}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:var(--t-hero);font-weight:700}
h2{font-size:var(--t-2xl);font-weight:600}
h3{font-size:var(--t-lg);font-weight:600}
h4{font-size:var(--t-md);font-weight:600}
p{margin:0}
code,kbd,.mono{font-family:var(--f-mono);font-size:.9em}
code{background:rgba(34,211,238,.08);color:#A5F3FC;padding:.1em .4em;border-radius:6px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
::selection{background:rgba(34,211,238,.3)}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--cyan);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:600}
.skip:focus{left:16px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.section{padding-block:clamp(56px,8vw,104px)}
.section-tight{padding-block:clamp(36px,5vw,64px)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:960px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:18px;height:1px;background:currentColor}
.lead{font-size:var(--t-md);color:var(--muted);max-width:62ch}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:var(--t-sm)}
.xs{font-size:var(--t-xs)}
.sec-head{display:flex;flex-direction:column;gap:14px;margin-bottom:40px;max-width:760px}
.grad-text{background:linear-gradient(100deg,#fff 10%,#9ED8FF 45%,var(--cyan) 70%,#B9A6FF);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Buttons */
.btn{--h:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h);padding:0 18px;border-radius:12px;font:600 var(--t-sm)/1 var(--f-body);border:1px solid transparent;cursor:pointer;color:var(--text);background:transparent;text-decoration:none!important;transition:transform .18s ease,background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn-primary{background:linear-gradient(135deg,var(--blue),#2563EB 55%,#0EA5E9);box-shadow:0 8px 24px -10px rgba(59,130,246,.8),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 30px -10px rgba(34,211,238,.7),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-ghost{border-color:var(--line-2);background:rgba(16,22,37,.6)}
.btn-ghost:hover{border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.06)}
.btn-quiet{color:var(--muted);padding:0 10px}
.btn-quiet:hover{color:var(--text);background:rgba(148,163,184,.08)}
.btn-danger{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.4);color:#FDA4AF}
.btn-danger:hover{background:rgba(244,63,94,.2)}
.btn-sm{--h:34px;padding:0 12px;border-radius:9px;font-size:var(--t-xs)}
.btn-lg{--h:52px;padding:0 24px;font-size:var(--t-base)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* Surfaces */
.card{background:linear-gradient(180deg,rgba(21,29,49,.72),rgba(16,22,37,.72));border:1px solid var(--line);border-radius:var(--r);padding:24px;position:relative;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card-link{transition:border-color .25s,transform .25s}
.card-link:hover{border-color:rgba(34,211,238,.4);transform:translateY(-3px)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font:500 var(--t-xs)/1 var(--f-body);border:1px solid var(--line-2);color:var(--muted);background:rgba(148,163,184,.05);white-space:nowrap}
.chip-cyan{color:var(--cyan);border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.07)}
.chip-blue{color:#93C5FD;border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.08)}
.chip-purple{color:#C4B5FD;border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.08)}
.chip-ok{color:#86EFAC;border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08)}
.chip-warn{color:#FCD34D;border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08)}
.chip-bad{color:#FDA4AF;border-color:rgba(244,63,94,.4);background:rgba(244,63,94,.08)}
.demo-flag{display:inline-flex;align-items:center;gap:6px;font:600 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#FCD34D;border:1px dashed rgba(245,158,11,.5);border-radius:6px;padding:5px 8px;background:rgba(245,158,11,.06)}
.icon{width:20px;height:20px;flex:none}
.icon-box{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(34,211,238,.08));border:1px solid rgba(59,130,246,.3);color:var(--cyan)}
hr.rule{border:0;border-top:1px solid var(--line);margin:0}

/* Announcement + header */
.announce{background:linear-gradient(90deg,rgba(59,130,246,.18),rgba(139,92,246,.16));border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.announce .wrap{display:flex;gap:12px;align-items:center;justify-content:center;min-height:40px;padding-block:6px;text-align:center;flex-wrap:wrap}
.announce b{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);font-weight:600}
.announce button{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px;display:grid}
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(7,10,18,.78);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:10px;color:var(--text);font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.02em;text-decoration:none!important}
.logo-mark{width:34px;height:34px}
.logo small{display:block;font:500 9px/1 var(--f-mono);letter-spacing:.18em;color:var(--muted);margin-top:3px}
.nav-links{display:flex;align-items:center;gap:2px;margin-left:auto;list-style:none;padding:0;margin-block:0}
.nav-links a,.nav-links>li>button{display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:9px;color:var(--muted);font:500 var(--t-sm)/1 var(--f-body);background:none;border:0;cursor:pointer;text-decoration:none!important;position:relative}
.nav-links a:hover,.nav-links>li>button:hover{color:var(--text);background:rgba(148,163,184,.07)}
.nav-links a.active{color:var(--text)}
.nav-links a.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-15px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 12px);left:-20px;width:380px;padding:10px;background:rgba(16,22,37,.97);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);display:none}
.dd.open .dd-menu{display:block}
.dd-menu a{display:flex!important;gap:12px;align-items:flex-start!important;padding:12px!important;border-radius:12px!important;color:var(--text)!important}
.dd-menu a:hover{background:rgba(59,130,246,.09)!important}
.dd-menu a span{display:block;font-size:var(--t-xs);color:var(--muted);margin-top:4px;line-height:1.4;font-weight:400}
.dd-menu a::after{display:none}
.nav-actions{display:flex;gap:8px;align-items:center}
.search-btn{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;border-radius:10px;border:1px solid var(--line-2);background:rgba(16,22,37,.6);color:var(--muted);cursor:pointer;font:400 var(--t-sm)/1 var(--f-body)}
.search-btn kbd{font-size:10px;border:1px solid var(--line-2);border-radius:5px;padding:2px 5px}
.menu-toggle{display:none;background:none;border:1px solid var(--line-2);border-radius:10px;width:40px;height:40px;color:var(--text);cursor:pointer;place-items:center}
.mobile-nav{display:none}
@media (max-width:1080px){
  .nav-links,.nav-actions .hide-m{display:none}
  .menu-toggle{display:grid}
  .nav-actions{margin-left:auto}
  .mobile-nav.open{display:block;position:fixed;inset:calc(68px + env(safe-area-inset-top,0px)) 0 0;background:var(--bg);overflow-y:auto;z-index:49;padding:12px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
  .mobile-nav a{display:block;padding:14px 4px;border-bottom:1px solid var(--line);color:var(--text);font:500 var(--t-md) var(--f-display)}
  .mobile-nav a.sub{padding-left:20px;font:400 var(--t-base) var(--f-body);color:var(--muted)}
}
@media (max-width:520px){.search-btn span,.search-btn kbd{display:none}}

/* Breadcrumbs / page head */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:var(--t-sm);color:var(--dim);list-style:none;padding:0;margin:0 0 20px}
.crumbs a{color:var(--muted)}
.crumbs li+li::before{content:"/";margin-right:6px;color:var(--dim)}
.page-head{padding-block:clamp(40px,6vw,80px) clamp(28px,4vw,48px);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.page-head h1{font-size:clamp(2rem,4.4vw,3.2rem);max-width:20ch}
.page-head .lead{margin-top:16px}

/* Hero */
.hero{padding-block:clamp(40px,6vw,84px) clamp(48px,7vw,96px);position:relative}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{margin:18px 0 22px;max-width:15ch}
.hero .lead{font-size:clamp(1rem,1.3vw,1.15rem)}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.hero-meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:36px;font:500 var(--t-xs)/1.4 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.hero-meta span{display:flex;align-items:center;gap:8px}
.hero-meta i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.hero-visual{position:relative;aspect-ratio:1/0.92;max-width:100%;border-radius:24px;border:1px solid var(--line-2);background:radial-gradient(circle at 50% 40%,rgba(59,130,246,.15),rgba(16,22,37,.4) 70%);overflow:hidden}
.hero-visual canvas{position:absolute;inset:0;width:100%;height:100%}
.telemetry{position:absolute;left:14px;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.telemetry div{background:rgba(7,10,18,.78);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:500 10px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.04em;min-width:0}
.telemetry b{display:block;font-size:13px;color:var(--text);margin-top:3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hv-tag{position:absolute;top:14px;left:14px;font:600 10px/1 var(--f-mono);letter-spacing:.12em;color:var(--cyan);background:rgba(7,10,18,.7);border:1px solid rgba(34,211,238,.3);padding:6px 9px;border-radius:7px}
@media (max-width:900px){.hero-grid{grid-template-columns:minmax(0,1fr)}.hero-visual{aspect-ratio:1/0.8}}

/* Feature + course cards */
.feat{display:flex;flex-direction:column;gap:14px}
.feat p{color:var(--muted);font-size:var(--t-sm)}
.course-card{display:flex;flex-direction:column;padding:0;overflow:hidden;color:var(--text);text-decoration:none!important}
.course-art{height:180px;position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.course-art svg{position:absolute;inset:0;width:100%;height:100%}
.course-body{padding:24px;display:flex;flex-direction:column;gap:14px;flex:1}
.course-body p{color:var(--muted);font-size:var(--t-sm)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{background:var(--surface);padding:10px 12px;font-size:var(--t-xs);color:var(--muted)}
.facts b{display:block;font:600 var(--t-base) var(--f-display);color:var(--text);font-variant-numeric:tabular-nums}
.outcomes{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:var(--t-sm);color:#CBD5E1}
.outcomes li{display:flex;gap:10px;align-items:flex-start}
.outcomes li svg{color:var(--cyan);margin-top:3px;flex:none;width:15px;height:15px}
.course-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:6px;font:600 var(--t-sm) var(--f-body);color:var(--cyan)}

/* Roadmap */
.roadmap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;position:relative;counter-reset:rm}
.rm-step{position:relative;padding:0 14px 0 0}
.rm-step .node{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid rgba(34,211,238,.4);color:var(--cyan);font:600 var(--t-sm) var(--f-mono);position:relative;z-index:1}
.rm-step::before{content:"";position:absolute;top:23px;left:46px;right:0;height:2px;background:linear-gradient(90deg,rgba(34,211,238,.6),rgba(59,130,246,.15));background-size:200% 100%;animation:flow 3s linear infinite}
.rm-step:last-child::before{display:none}
.rm-step h4{margin:18px 0 8px;font-size:var(--t-base)}
.rm-step p{font-size:var(--t-sm);color:var(--muted)}
@keyframes flow{to{background-position:-200% 0}}
@media (max-width:860px){.roadmap{grid-template-columns:minmax(0,1fr);gap:22px}.rm-step{display:grid;grid-template-columns:46px 1fr;gap:4px 16px;padding:0}.rm-step h4{margin:0;align-self:center}.rm-step p{grid-column:2}.rm-step::before{top:46px;left:22px;width:2px;height:calc(100% - 24px);right:auto;background:linear-gradient(rgba(34,211,238,.6),rgba(59,130,246,.15))}}

/* Bento */
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.bento .b1{grid-column:span 4}.bento .b2{grid-column:span 2}.bento .b3{grid-column:span 2}.bento .b4{grid-column:span 2}.bento .b5{grid-column:span 2}
@media (max-width:860px){.bento{grid-template-columns:minmax(0,1fr)}.bento>*{grid-column:auto!important}}
.bento h3{font-size:var(--t-md);margin:14px 0 8px}
.bento p{color:var(--muted);font-size:var(--t-sm)}

/* Paper band (light surface) */
.paper{background:var(--paper);color:var(--ink)}
.paper .eyebrow{color:#2563EB}
.paper .lead,.paper p{color:var(--ink-2)}
.paper h2,.paper h3,.paper h4{color:var(--ink)}
.process{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.process>div{background:#fff;border:1px solid #D9E1EC;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 rgba(11,18,32,.04),0 12px 30px -20px rgba(11,18,32,.25)}
.process .k{font:600 var(--t-xs) var(--f-mono);color:#2563EB;letter-spacing:.1em}
.process p{font-size:var(--t-sm)}
@media (max-width:960px){.process{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.process{grid-template-columns:minmax(0,1fr)}}

/* Accordion */
.acc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:rgba(16,22,37,.55)}
.acc details{border-top:1px solid var(--line)}
.acc details:first-child{border-top:0}
.acc summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;gap:16px;align-items:center;justify-content:space-between;font:600 var(--t-base) var(--f-display)}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:rgba(59,130,246,.05)}
.acc summary .chev{transition:transform .25s;color:var(--muted);flex:none}
.acc details[open] summary .chev{transform:rotate(180deg);color:var(--cyan)}
.acc .acc-body{padding:0 22px 22px;color:var(--muted);font-size:var(--t-sm)}
.acc .acc-body>*+*{margin-top:12px}
.mod-num{font:600 var(--t-xs) var(--f-mono);color:var(--cyan);letter-spacing:.08em;margin-right:12px}
.lesson-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px}
@media (max-width:640px){.lesson-list{grid-template-columns:minmax(0,1fr)}}
.lesson-list a{display:flex;gap:10px;align-items:baseline;padding:7px 0;color:#CBD5E1;border-bottom:1px dashed var(--line)}
.lesson-list a:hover{color:var(--cyan);text-decoration:none}
.lesson-list .n{font:500 11px var(--f-mono);color:var(--dim);min-width:34px}

/* Forms */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label{font:500 var(--t-sm) var(--f-body);color:#CBD5E1}
.field .hint{font-size:var(--t-xs);color:var(--dim)}
.input,select.input,textarea.input{width:100%;height:46px;padding:0 14px;border-radius:11px;border:1px solid var(--line-2);background:rgba(7,10,18,.7);color:var(--text);font:400 var(--t-base) var(--f-body);transition:border-color .2s,box-shadow .2s}
textarea.input{height:auto;min-height:130px;padding:12px 14px;resize:vertical;line-height:1.55}
.input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.input[aria-invalid="true"]{border-color:var(--bad)}
.err{font-size:var(--t-xs);color:#FDA4AF;min-height:1em}
.mono-in{font-family:var(--f-mono)}
.alert{border-radius:12px;padding:14px 16px;font-size:var(--t-sm);border:1px solid var(--line-2);background:rgba(148,163,184,.06);display:flex;gap:12px;align-items:flex-start}
.alert svg{flex:none;margin-top:2px}
.alert-ok{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.07);color:#BBF7D0}
.alert-bad{border-color:rgba(244,63,94,.4);background:rgba(244,63,94,.07);color:#FECDD3}
.alert-warn{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.07);color:#FDE68A}
.alert-info{border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.07);color:#BFDBFE}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 var(--t-xs) var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:rgba(16,22,37,.8);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}

/* Lab */
.lab-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.lab-tab{flex:none;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(16,22,37,.6);color:var(--muted);font:500 var(--t-sm) var(--f-body);cursor:pointer;display:flex;gap:8px;align-items:center}
.lab-tab[aria-selected="true"]{color:var(--text);border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.08)}
.lab-pane{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.lab-pane{grid-template-columns:minmax(0,1fr)}}
.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.result-grid>div{background:var(--surface);padding:12px 14px;min-width:0}
.result-grid span{display:block;font:500 11px var(--f-mono);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.result-grid b{font:600 var(--t-base) var(--f-mono);color:var(--text);word-break:break-all}
@media (max-width:480px){.result-grid{grid-template-columns:minmax(0,1fr)}}
.bits{font-family:var(--f-mono);font-size:12px;line-height:1.9;overflow-x:auto;white-space:nowrap;padding:12px 14px;background:rgba(7,10,18,.7);border:1px solid var(--line);border-radius:10px}
.bits .n{color:var(--cyan)}.bits .h{color:#C4B5FD}
.osi{display:flex;flex-direction:column;gap:6px}
.osi button{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:rgba(16,22,37,.7);color:var(--text);cursor:pointer;font:500 var(--t-sm) var(--f-body);transition:all .2s}
.osi button b{font:600 var(--t-sm) var(--f-mono);color:var(--cyan)}
.osi button:hover,.osi button[aria-pressed="true"]{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.07);transform:translateX(4px)}
.terminal{background:#05070D;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;font:400 13px/1.6 var(--f-mono)}
.term-bar{display:flex;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--dim);font-size:11px}
.term-bar i{width:10px;height:10px;border-radius:50%;background:#334155}
.term-out{height:300px;overflow-y:auto;padding:14px;white-space:pre-wrap;word-break:break-word;color:#CBD5E1}
.term-out .p{color:var(--ok)}.term-out .e{color:#FDA4AF}.term-out .s{color:var(--cyan)}
.term-in{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.term-in span{color:var(--ok);white-space:nowrap}
.term-in input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;outline:none}
.canvas-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.zone{border:1.5px dashed var(--line-2);border-radius:14px;padding:12px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.zone h5{margin:0;font:600 var(--t-xs) var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.zone.pub{border-color:rgba(59,130,246,.45)}.zone.priv{border-color:rgba(139,92,246,.45)}
.comp{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:var(--t-sm)}
.prio-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.prio-list li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.prio-list .rank{font:600 var(--t-sm) var(--f-mono);color:var(--cyan)}
.packet-svg{width:100%;height:auto;display:block}
.step-log{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:var(--t-sm)}
.step-log li{padding:10px 12px;border-radius:10px;border:1px solid var(--line);color:var(--muted);background:rgba(16,22,37,.5)}
.step-log li.on{color:var(--text);border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.06)}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:16px}
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border-radius:11px;border:1px solid var(--line-2);background:rgba(7,10,18,.5);color:var(--text);cursor:pointer;font:400 var(--t-sm)/1.5 var(--f-body)}
.q-opt:hover:not([disabled]){border-color:rgba(34,211,238,.5)}
.q-opt .k{font:600 var(--t-xs) var(--f-mono);color:var(--muted);border:1px solid var(--line-2);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;flex:none}
.q-opt.right{border-color:rgba(34,197,94,.6);background:rgba(34,197,94,.08)}
.q-opt.wrong{border-color:rgba(244,63,94,.6);background:rgba(244,63,94,.08)}
.q-opt[disabled]{cursor:default}
.progress{height:8px;border-radius:99px;background:rgba(148,163,184,.12);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .5s}

/* Lesson player + dashboards */
.app-shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start;padding-block:28px 72px}
.side-wrap{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));align-self:start;min-width:0}
.side{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 110px);overflow-y:auto}
.side-toggle{display:none;width:100%;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 16px;border-radius:14px;border:1px solid var(--line-2);background:rgba(16,22,37,.92);color:var(--text);font:600 var(--t-sm) var(--f-body);cursor:pointer;text-align:left}
.side-toggle .chev{transition:transform .25s;color:var(--muted);flex:none}
.side-toggle[aria-expanded="true"] .chev{transform:rotate(180deg);color:var(--cyan)}
.side-toggle small{display:block;font:500 10px var(--f-mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-bottom:2px}
.side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:var(--t-sm);text-decoration:none!important}
.side a:hover{background:rgba(148,163,184,.07);color:var(--text)}
.side a.active{background:rgba(59,130,246,.12);color:var(--text);box-shadow:inset 2px 0 0 var(--cyan)}
.side .side-h{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:16px 12px 6px}
@media (max-width:900px){.app-shell{grid-template-columns:minmax(0,1fr)}.side-wrap{position:sticky;top:calc(68px + env(safe-area-inset-top,0px));z-index:30;margin-inline:calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding:8px max(20px,env(safe-area-inset-left,0px));background:rgba(7,10,18,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.side-toggle{display:flex}.side{display:none;margin-top:8px;padding:8px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);max-height:min(65vh,520px);box-shadow:0 24px 50px -20px rgba(0,0,0,.8)}.side.open{display:flex}.side a{padding:12px}.side .side-h{padding:12px 12px 4px}}
.lesson-side a{align-items:flex-start;font-size:13px;line-height:1.4;padding:8px 10px}
.lesson-side .done{color:var(--ok)}
.prose{max-width:72ch;font-size:1.02rem;color:#D5DEEA}
.prose>*+*{margin-top:1.1em}
.prose h2{font-size:var(--t-xl);margin-top:1.8em;color:var(--text)}
.prose h3{font-size:var(--t-lg);margin-top:1.5em;color:var(--text)}
.prose ul,.prose ol{padding-left:1.3em}
.prose li+li{margin-top:.4em}
.prose strong{color:var(--text)}
.prose pre{background:#05070D;border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto;font:13px/1.6 var(--f-mono);color:#CBD5E1}
.prose pre code{background:none;padding:0;color:inherit}
.callout{border:1px solid var(--line-2);border-left:3px solid var(--cyan);border-radius:12px;padding:16px 18px;background:rgba(34,211,238,.04)}
.callout h4{font-size:var(--t-sm);font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}
.callout.warn{border-left-color:var(--warn);background:rgba(245,158,11,.05)}.callout.warn h4{color:var(--warn)}
.callout.ok{border-left-color:var(--ok);background:rgba(34,197,94,.05)}.callout.ok h4{color:var(--ok)}
.terms{display:flex;flex-wrap:wrap;gap:8px}
.stat{display:flex;flex-direction:column;gap:6px}
.stat b{font:600 var(--t-xl) var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:var(--t-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-mono)}
.empty{padding:40px 24px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:rgba(148,163,184,.08);max-width:100%}
.heat i.l1{background:rgba(34,211,238,.25)}.heat i.l2{background:rgba(34,211,238,.5)}.heat i.l3{background:var(--cyan)}

/* Dialog, toast, palette */
dialog{border:1px solid var(--line-2);border-radius:18px;background:var(--surface);color:var(--text);padding:0;width:min(560px,calc(100vw - 32px));box-shadow:0 40px 80px -20px rgba(0,0,0,.8)}
dialog::backdrop{background:rgba(3,5,10,.7);backdrop-filter:blur(4px)}
.dlg-body{padding:24px;display:flex;flex-direction:column;gap:16px}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:400 var(--t-md) var(--f-body);outline:none}
.pal-res{max-height:min(420px,60vh);overflow-y:auto;padding:8px}
.pal-res a{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;color:var(--text);font-size:var(--t-sm);text-decoration:none!important}
.pal-res a:hover,.pal-res a.sel{background:rgba(59,130,246,.12)}
.pal-res a small{color:var(--dim);font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;flex:none}
.toast-host{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--surface-3);border:1px solid var(--line-2);border-radius:12px;padding:12px 16px;font-size:var(--t-sm);box-shadow:0 20px 40px -14px rgba(0,0,0,.7);display:flex;gap:10px;align-items:center;animation:tin .3s ease}
@keyframes tin{from{transform:translateY(8px)}}
.to-top{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:rgba(16,22,37,.9);color:var(--text);cursor:pointer;display:grid;place-items:center}

/* Footer */
.site-footer{border-top:1px solid var(--line);margin-top:0;background:linear-gradient(180deg,rgba(16,22,37,.4),rgba(7,10,18,1))}
.foot-grid{display:grid;grid-template-columns:1.4fr repeat(4,minmax(0,1fr));gap:32px;padding-block:64px 40px}
.foot-grid h5{font:600 var(--t-xs) var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.foot-grid ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;font-size:var(--t-sm)}
.foot-grid a{color:#CBD5E1}
.foot-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px;border-top:1px solid var(--line);font-size:var(--t-xs);color:var(--dim)}
@media (max-width:900px){.foot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.foot-grid>div:first-child{grid-column:1/-1}}

/* CTA */
.cta{border-radius:28px;padding:clamp(36px,6vw,72px);position:relative;overflow:hidden;border:1px solid rgba(59,130,246,.35);background:radial-gradient(600px 300px at 15% 0%,rgba(59,130,246,.3),transparent 70%),radial-gradient(500px 300px at 100% 100%,rgba(139,92,246,.25),transparent 70%),var(--surface)}
.cta h2{font-size:clamp(1.9rem,4.2vw,3rem);max-width:18ch}

/* Motion */
.reveal{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.pre{transform:translateY(18px)}
.page-enter{animation:pg .45s cubic-bezier(.2,.7,.2,1)}
@keyframes pg{from{transform:translateY(10px)}}
.glow-orb{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(80px);opacity:.35;pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(60px,40px) scale(1.1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.reveal.pre{transform:none}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab-row{display:flex;gap:6px;flex-wrap:wrap}
.tab-row button{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);background:transparent;color:var(--muted);cursor:pointer;font:500 var(--t-sm) var(--f-body)}
.tab-row button[aria-pressed="true"]{background:rgba(34,211,238,.1);color:var(--text);border-color:rgba(34,211,238,.5)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:28px}
.filters .field{min-width:170px;flex:1}

/* ---------- Mobile refinements ---------- */
.lab-select{display:none}
@media (max-width:640px){
  .section{padding-block:48px}
  .section-tight{padding-block:32px}
  .sec-head{margin-bottom:24px}
  .card{padding:18px}
  .btn-sm{--h:40px}
  input.input,select.input,textarea.input{font-size:16px!important}
  /* announcement: compact two-line bar */
  .announce{font-size:12.5px}
  .announce .wrap{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding-block:8px;min-height:0}
  .announce b{display:none}
  .announce span{grid-column:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .announce a{grid-column:1;font-weight:600}
  .announce button{grid-column:2;grid-row:1/3;align-self:center}
  .nav{height:60px;gap:12px}
  .logo small{display:none}
  .logo-mark{width:30px;height:30px}
  .mobile-nav.open{inset:calc(60px + env(safe-area-inset-top,0px)) 0 0}
  /* hero */
  .hero{padding-block:28px 24px}
  .hero h1{margin:14px 0 16px}
  .hero-actions{gap:10px;margin-top:24px}
  .hero-actions .btn{flex:1 1 100%}
  .hero-meta{gap:8px 16px;margin-top:22px}
  .hero-visual{aspect-ratio:4/3.4;border-radius:18px}
  .telemetry{left:10px;right:10px;bottom:10px;gap:6px}
  .telemetry div{padding:6px 8px;font-size:9px}
  .telemetry b{font-size:11.5px}
  .page-head{padding-block:28px 24px}
  .page-head h1{font-size:clamp(1.8rem,8vw,2.3rem)}
  .page-head .lead{font-size:1rem}
  /* swipeable card rows */
  .swipe{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin-inline:calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding-inline:max(20px,env(safe-area-inset-left,0px));padding-bottom:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .swipe::-webkit-scrollbar{display:none}
  .swipe>*{flex:0 0 min(80%,300px);scroll-snap-align:start}
  .swipe-hint{display:flex;align-items:center;gap:6px;font:500 11px var(--f-mono);letter-spacing:.08em;color:var(--dim);margin-bottom:10px}
  /* stats: two per row, compact */
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px}
  .stats .card{padding:14px}
  .stats .icon-box{display:none}
  .stats .stat b{font-size:var(--t-lg)}
  /* tables become stacked cards */
  .table-stack thead{display:none}
  .table-stack,.table-stack tbody,.table-stack tr{display:block;width:100%}
  .table-stack tr{padding:12px 14px;border-bottom:1px solid var(--line)}
  .table-stack tr:last-child{border-bottom:0}
  .table-stack td{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;border:0;padding:4px 0;min-width:0;word-break:break-word}
  .table-stack td::before{content:attr(data-label);font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .table-stack td>*{justify-self:start}
  .table-stack td[data-label=""]{grid-template-columns:minmax(0,1fr)}
  .table-stack td[data-label=""]::before{display:none}
  .table-wrap:has(.table-stack){overflow-x:visible}
  /* labs */
  .lab-tabs{display:none}
  .lab-select{display:flex}
  .lab-pane{gap:16px}
  .result-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .result-grid b{font-size:13px}
  .term-out{height:260px;font-size:12px}
  .canvas-board{gap:8px}
  .zone{padding:8px;min-height:90px}
  .comp{font-size:12px;padding:6px 8px}
  .q-opt{padding:12px}
  #pjWrap{max-width:420px;margin-inline:auto}
  .prio-list li{grid-template-columns:22px minmax(0,1fr);gap:8px}
  .prio-list li>.row{grid-column:1/-1;justify-content:flex-end}
  /* dashboards */
  .app-shell{padding-block:16px 56px;gap:18px}
  .side-wrap{top:calc(60px + env(safe-area-inset-top,0px))}
  .acc summary{padding:16px;font-size:var(--t-sm)}
  .acc .acc-body{padding:0 16px 18px}
  .cta{border-radius:20px;padding:28px 20px}
  .cta .hero-actions .btn{flex:1 1 100%}
  .prose{font-size:1rem}
  .crumbs{font-size:var(--t-xs);margin-bottom:14px}
  .foot-grid{padding-block:44px 28px;gap:24px}
  .to-top{width:40px;height:40px}
  dialog{border-radius:16px}
  .dlg-body{padding:18px}
}
@media (max-width:380px){.result-grid{grid-template-columns:minmax(0,1fr)}.stats .stat b{font-size:var(--t-md)}}
</style>

/* ---------- password hashing (demo: browser only; production hashes on the server with argon2/bcrypt) ---------- */
async function hashPw(pw, salt) {
  const data = new TextEncoder().encode(salt + ":" + pw);
  try {
    const buf = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  } catch {
    let h = 2166136261; for (const b of data) { h ^= b; h = Math.imul(h, 16777619); } return "f" + (h >>> 0).toString(16);
  }
}

"networking/m1-l1": {
  minutes: 25,
  what: "A computer network is two or more devices connected so they can exchange data and share resources such as files, printers and an internet connection.",
  why: "Almost every IT role touches a network. When a user says 'the internet is down', the person who understands how the network is built is the one who fixes it quickly.",
  body: `<p>Every network, from two laptops sharing a file to the global internet, has the same four ingredients:</p>
<ul><li><strong>Nodes</strong> — the devices that send or receive data: computers, phones, printers, servers, cameras.</li>
<li><strong>Links</strong> — the media that carry signals between nodes: copper Ethernet cable, fibre, or radio waves (Wi-Fi).</li>
<li><strong>Intermediary devices</strong> — switches, routers and access points that move data towards the right destination.</li>
<li><strong>Rules (protocols)</strong> — agreed formats such as Ethernet, IP and TCP that let devices from different manufacturers understand one another.</li></ul>
<p>Data does not travel as one large file. It is split into small units called <strong>packets</strong>. Each packet carries a source and destination address, so intermediary devices can forward it hop by hop, much as a postal system routes letters by the address on the envelope.</p>`,
  example: "In a small office, ten laptops and a printer connect to a switch. The switch connects to a router, and the router connects to the internet provider. When a laptop prints, its data crosses one switch. When it loads a website, the data crosses the switch, the router and many networks beyond.",
  diagram: "office",
  exercise: "Draw your home or college network. List every node (phones, laptops, smart TV), every link type (cable or Wi-Fi), and every intermediary device. Which single device, if it failed, would disconnect everyone?",
  quiz: [
    { q: "Which device forwards traffic between your home network and the internet provider?", options: ["Switch", "Router", "Printer", "Repeater cable"], answer: 1, why: "A router connects separate networks — here, your LAN and the provider's network." },
    { q: "Why is data split into packets?", options: ["To make files smaller permanently", "So many conversations can share links and lost pieces can be resent", "Because cables can only carry text", "To encrypt the data"], answer: 1, why: "Packets let links be shared fairly and allow individual pieces to be retransmitted." }
  ],
  mistakes: ["Calling every box with blinking lights a 'router' — switches and access points do different jobs.", "Assuming Wi-Fi and the internet are the same thing. Wi-Fi is only the local radio link.", "Forgetting that protocols, not just cables, are what make devices interoperate."],
  summary: "A network is nodes plus links plus intermediary devices, all speaking common protocols. Data moves as addressed packets forwarded hop by hop.",
  further: ["Module 1 lesson 3: Network topologies", "Lab: Packet journey visualizer"]
},
"networking/m2-l1": {
  minutes: 35,
  what: "The OSI (Open Systems Interconnection) model divides network communication into seven layers, each with one job, from physical signals up to the application the user sees.",
  why: "Layers give you a shared vocabulary and a troubleshooting map. 'It's a Layer 1 problem' tells a colleague to check cables before anything else.",
  body: `<p>Read the layers from the bottom up, the way data is built on the wire:</p>
<ol><li><strong>Physical</strong> — bits as electrical, light or radio signals. Cables, connectors, signal strength.</li>
<li><strong>Data Link</strong> — frames between devices on the same network, addressed by MAC address. Switches work here.</li>
<li><strong>Network</strong> — packets between networks, addressed by IP address. Routers work here.</li>
<li><strong>Transport</strong> — segments between applications, identified by port numbers. TCP adds reliability; UDP adds speed.</li>
<li><strong>Session</strong> — opening, maintaining and closing conversations.</li>
<li><strong>Presentation</strong> — data format, compression and encryption (for example, TLS).</li>
<li><strong>Application</strong> — the protocols programs use directly: HTTP, DNS, SMTP.</li></ol>
<p>Each layer adds its own header when sending (<strong>encapsulation</strong>) and removes it when receiving (<strong>decapsulation</strong>). The TCP/IP model used on the real internet merges layers 5–7 into one Application layer and layers 1–2 into Network Access, but the OSI numbers remain the common shorthand.</p>`,
  example: "When you open https://example.com, your browser writes an HTTP request (L7), TLS encrypts it (L6), TCP wraps it in a segment to port 443 (L4), IP adds source and destination addresses (L3), Ethernet or Wi-Fi adds MAC addresses (L2), and the network card sends signals (L1).",
  diagram: "osi",
  exercise: "Open the OSI explorer in the lab. For each layer, name one device or protocol and one problem you would troubleshoot there (for example L1: unplugged cable).",
  quiz: [
    { q: "At which layer does a switch make its forwarding decisions?", options: ["Layer 1", "Layer 2", "Layer 3", "Layer 7"], answer: 1, why: "Switches forward frames based on MAC addresses — Layer 2." },
    { q: "Port numbers belong to which layer?", options: ["Network", "Transport", "Session", "Physical"], answer: 1, why: "TCP and UDP ports identify applications at the Transport layer." }
  ],
  mistakes: ["Memorising layer names without knowing what each one does.", "Thinking the OSI model is a protocol — it is a reference model.", "Placing IP addresses at Layer 2. MAC is Layer 2; IP is Layer 3."],
  summary: "Seven layers, each with a single responsibility. Encapsulation adds headers on the way down; decapsulation removes them on the way up. Troubleshoot from the bottom.",
  further: ["Lab: OSI model explorer", "Module 2 lesson 3: Encapsulation and decapsulation"]
},
"networking/m3-l5": {
  minutes: 45,
  what: "A subnet mask marks which part of an IPv4 address identifies the network and which part identifies the host. Subnetting divides one block into smaller networks.",
  why: "Every address plan, firewall rule and cloud VPC depends on subnetting. Getting it wrong causes overlapping networks, unreachable hosts and wasted address space.",
  body: `<p>An IPv4 address is 32 bits, written as four octets. A prefix such as <code>/26</code> means the first 26 bits are the network portion. The remaining <code>32 − 26 = 6</code> bits are host bits.</p>
<h3>The four-step method</h3>
<ol><li><strong>Host bits</strong>: h = 32 − prefix.</li>
<li><strong>Block size</strong>: 2<sup>h</sup> addresses per subnet.</li>
<li><strong>Network address</strong>: the largest multiple of the block size that is ≤ the address (in the octet where the mask stops).</li>
<li><strong>Broadcast</strong>: network address + block size − 1. Usable hosts sit between them: 2<sup>h</sup> − 2.</li></ol>
<p>Worked example: <code>192.168.10.77/26</code>. h = 6, block = 64. Multiples of 64 in the last octet: 0, 64, 128, 192. 77 falls in the 64 block, so the network is <code>192.168.10.64</code>, broadcast <code>192.168.10.127</code>, usable range <code>.65 – .126</code> (62 hosts). The mask is <code>255.255.255.192</code> because 11000000 = 192.</p>`,
  example: "An office needs four departments of up to 50 devices each from 192.168.10.0/24. A /26 gives 62 usable hosts per subnet and exactly four subnets: .0, .64, .128 and .192.",
  diagram: "subnet",
  exercise: "Without the calculator, find the network, broadcast and usable range for 10.20.30.200/27. Then check your answer in the lab's subnet calculator.",
  quiz: [
    { q: "What is the subnet mask for a /27?", options: ["255.255.255.192", "255.255.255.224", "255.255.255.240", "255.255.255.0"], answer: 1, why: "27 bits = 24 + 3, and 11100000 = 224." },
    { q: "Which is the broadcast address of 172.16.5.130/25?", options: ["172.16.5.127", "172.16.5.255", "172.16.5.128", "172.16.5.254"], answer: 1, why: "/25 blocks are 0–127 and 128–255. 130 is in the second, whose broadcast is .255." }
  ],
  mistakes: ["Forgetting to subtract 2 for the network and broadcast addresses.", "Using the block size from the wrong octet when the prefix is below /24.", "Assigning the network or broadcast address to a host."],
  summary: "Host bits → block size → network (multiple of block) → broadcast (next block − 1). Usable hosts = 2ʰ − 2.",
  further: ["Lab: Subnetting calculator", "Module 3 lesson 9: Practical subnetting exercises"]
},
"cloud-computing/m1-l1": {
  minutes: 25,
  what: "Cloud computing is renting computing resources — servers, storage, databases, networking — on demand over the internet, paying for what you use instead of owning the hardware.",
  why: "Most new applications are deployed to the cloud, and on-premises networks increasingly connect to it. Network and security roles now require cloud fluency.",
  body: `<p>The widely used NIST definition lists five essential characteristics:</p>
<ul><li><strong>On-demand self-service</strong> — create resources yourself through a console or API, without waiting for a person.</li>
<li><strong>Broad network access</strong> — reach those resources over standard networks.</li>
<li><strong>Resource pooling</strong> — the provider shares physical hardware among many customers, isolated from each other.</li>
<li><strong>Rapid elasticity</strong> — scale up or down quickly, sometimes automatically.</li>
<li><strong>Measured service</strong> — usage is metered and billed.</li></ul>
<p>Behind the console are ordinary data centres full of servers, switches and routers. What changes is ownership and control: the provider runs the physical layer, and you control virtual resources through software.</p>`,
  example: "A college fest website expects 50 visitors a day but 20,000 on results day. With cloud hosting, the team adds servers for that one day and removes them afterwards, paying only for the hours used.",
  diagram: "cloud",
  exercise: "Pick an application you use daily. Which of the five characteristics would matter most to the team running it, and why?",
  quiz: [
    { q: "Which characteristic lets you add servers automatically during a traffic spike?", options: ["Measured service", "Rapid elasticity", "Resource pooling", "Broad network access"], answer: 1, why: "Elasticity is the ability to scale capacity up and down with demand." },
    { q: "Is cloud infrastructure 'serverless' in the sense of having no physical servers?", options: ["Yes", "No — the provider operates physical servers you do not manage"], answer: 1, why: "Cloud services always run on physical hardware; the provider simply manages it for you." }
  ],
  mistakes: ["Assuming cloud is automatically cheaper. Always-on, oversized resources can cost more than owned hardware.", "Assuming the provider secures everything. See the shared responsibility model.", "Forgetting that cloud resources still use IP addressing, routing and firewalls."],
  summary: "Cloud = on-demand, metered, elastic resources from a shared provider pool, controlled through software.",
  further: ["Module 1 lesson 6: Shared responsibility model", "Lab: Cloud architecture builder"]
},
"cloud-computing/m1-l6": {
  minutes: 30,
  what: "The shared responsibility model divides security duties between the cloud provider and the customer. The provider secures the cloud itself; the customer secures what they put in it.",
  why: "Many cloud breaches come from customer-side misconfiguration — public storage buckets, open firewall rules, weak credentials — not from failures of the provider.",
  body: `<p>The split moves with the service model:</p>
<ul><li><strong>IaaS</strong> (virtual machines): provider handles facilities, hardware, hypervisor. You handle the OS, patches, applications, data, identities and network rules.</li>
<li><strong>PaaS</strong> (managed databases, app platforms): provider also runs the OS and runtime. You handle application code, data, access and configuration.</li>
<li><strong>SaaS</strong> (email, office suites): provider runs nearly everything. You still own your data, user accounts and access settings.</li></ul>
<p>Across all three, the customer always remains responsible for <strong>data, identities and access configuration</strong>.</p>`,
  example: "A student deploys a database VM with port 5432 open to 0.0.0.0/0. The provider's data centre is fully secure, yet the database is exposed — the firewall rule was the customer's responsibility.",
  diagram: "shared",
  exercise: "For a managed database (PaaS), list three things the provider is responsible for and three you are responsible for.",
  quiz: [
    { q: "In SaaS, who manages which users can access the data?", options: ["The provider only", "The customer", "Nobody"], answer: 1, why: "Identity and access configuration always remains a customer responsibility." },
    { q: "Who patches the hypervisor in IaaS?", options: ["The customer", "The provider"], answer: 1, why: "The hypervisor and physical hosts are part of 'security of the cloud'." }
  ],
  mistakes: ["Believing a managed service means no security work for you.", "Leaving default open network rules in place.", "Not reviewing which identities have administrator access."],
  summary: "Provider: security OF the cloud. Customer: security IN the cloud. Data, identities and access are always yours.",
  further: ["Module 5: Cloud Network Security"]
},
"cloud-computing/m3-l1": {
  minutes: 40,
  what: "A virtual private cloud (VPC on AWS and Google Cloud, VNet on Azure) is an isolated private network inside a cloud provider where you define the address range, subnets and routing.",
  why: "Every cloud workload lives in a virtual network. Its design decides what is reachable from the internet, what stays private and how it connects to other networks.",
  body: `<p>Designing a virtual network uses the same skills as on-premises networking:</p>
<ol><li><strong>Choose a CIDR range</strong> from private space (for example <code>10.20.0.0/16</code>) that will not overlap with offices or other VPCs you may connect later.</li>
<li><strong>Create subnets per availability zone and per tier</strong> — for example a public web subnet and a private app subnet in each of two zones.</li>
<li><strong>Attach route tables</strong>. A public subnet routes <code>0.0.0.0/0</code> to an internet gateway; a private subnet routes it to a NAT gateway (outbound only) or nowhere.</li>
<li><strong>Apply filters</strong> — security groups on interfaces and optional network ACLs on subnets.</li></ol>
<p><em>Cost note:</em> creating a VPC and subnets is free on the major providers, but NAT gateways and some load balancers are billed hourly. The lab simulates them at no cost.</p>`,
  example: "VPC 10.20.0.0/16 → public subnets 10.20.1.0/24 (zone A) and 10.20.2.0/24 (zone B) with a load balancer; private subnets 10.20.11.0/24 and 10.20.12.0/24 for app servers; a database in 10.20.21.0/24 reachable only from the app subnets.",
  diagram: "vpc",
  exercise: "In the cloud architecture builder, place a load balancer, two app servers and a database so the design passes all checks.",
  quiz: [
    { q: "Where should a production database usually be placed?", options: ["Public subnet with a public IP", "Private subnet reachable only from the app tier", "Any subnet, protected by a strong password"], answer: 1, why: "Keeping the database private removes it from the internet-facing attack surface." },
    { q: "Why choose a VPC CIDR that does not overlap your office network?", options: ["It is cheaper", "So the networks can be connected later by VPN or peering", "Overlap is required"], answer: 1, why: "Overlapping ranges make routing between the networks ambiguous." }
  ],
  mistakes: ["Using a tiny CIDR range that cannot grow.", "Putting everything in one public subnet.", "Forgetting a NAT path for private servers that need updates."],
  summary: "A VPC is your private network in the cloud: pick a non-overlapping CIDR, split subnets by zone and tier, route deliberately, filter in layers.",
  further: ["Lab: Cloud architecture builder", "Module 3 lesson 6: Internet and NAT gateways"]
},
"ethical-hacking/m1-l1": {
  minutes: 25,
  what: "Confidentiality, integrity and availability — the CIA triad — are the three properties security tries to protect for any information or system.",
  why: "Every control, finding and risk can be explained by which of the three it protects or threatens. Reports that name the affected property are clearer to readers.",
  body: `<ul><li><strong>Confidentiality</strong> — only authorized people can read the information. Controls: access control, encryption, need-to-know.</li>
<li><strong>Integrity</strong> — information is accurate and changed only in authorized ways. Controls: hashing, digital signatures, change control, input validation.</li>
<li><strong>Availability</strong> — information and services are usable when needed. Controls: redundancy, backups, capacity planning, DDoS protection.</li></ul>
<p>The properties sometimes pull against each other. Encrypting everything with keys stored in one place improves confidentiality but risks availability if that key is lost. Good security balances all three for the system's purpose.</p>`,
  example: "A college results portal: leaked marks break confidentiality; altered marks break integrity; a crash on results day breaks availability.",
  diagram: "cia",
  exercise: "For your email account, write one threat and one control for each of the three properties.",
  quiz: [
    { q: "An attacker changes the amount on an invoice in transit. Which property is violated?", options: ["Confidentiality", "Integrity", "Availability"], answer: 1, why: "The data was modified without authorization." },
    { q: "Regular, tested backups mainly protect:", options: ["Confidentiality", "Availability (and integrity on recovery)", "Neither"], answer: 1, why: "Backups let a service and its correct data be restored after loss." }
  ],
  mistakes: ["Treating security as only confidentiality.", "Adding controls that make a system unusable.", "Ignoring integrity — undetected tampering can be worse than a visible outage."],
  summary: "Protect who can read it (C), whether it is correct (I) and whether it is there when needed (A).",
  further: ["Module 1 lesson 2: Threats, vulnerabilities, and risk"]
},
"ethical-hacking/m1-l8": {
  minutes: 30,
  what: "Ethical hacking is security testing performed with the system owner's explicit, written permission, within an agreed scope and rules of engagement, to help them fix weaknesses.",
  why: "Permission is the difference between a security professional and an offender. In India, unauthorized access to computer systems is an offence under the Information Technology Act, 2000, and most countries have similar laws.",
  body: `<p>Before any testing, a professional engagement defines in writing:</p>
<ul><li><strong>Authorization</strong> — signed by someone with authority over every system in scope.</li>
<li><strong>Scope</strong> — exactly which hosts, address ranges, applications and accounts may be tested, and which may not.</li>
<li><strong>Rules of engagement</strong> — permitted techniques, testing windows, data-handling rules and limits (for example, no denial-of-service).</li>
<li><strong>Contacts and stop conditions</strong> — whom to call if something breaks or a serious issue is found.</li></ul>
<p>In this course you practise only on your own lab machines and intentionally vulnerable applications. That habit — confirm authorization first — is the most important skill you will carry into a security career.</p>`,
  example: "A tester authorized for app.example-client.test notices an unlisted admin server. They stop, record it, and email the client contact to ask whether it is in scope, rather than testing it.",
  diagram: "roe",
  exercise: "Draft a one-page rules-of-engagement document for testing your own home lab VM. Include scope, allowed tools, time window and stop conditions.",
  quiz: [
    { q: "Who can authorize a test of a company's servers?", options: ["Any employee", "Someone with authority over those systems, in writing", "The tester themselves"], answer: 1, why: "Authorization must come from a person entitled to grant it, and be documented." },
    { q: "A critical issue is found mid-test. Per the RoE you should:", options: ["Keep quiet until the final report", "Follow the agreed escalation path to the client contact", "Publish it online"], answer: 1, why: "RoE define urgent escalation so the owner can protect systems quickly." }
  ],
  mistakes: ["Treating a verbal 'go ahead' as authorization.", "Testing an IP that 'looks related' but is not in scope.", "Keeping sensitive client data after the engagement."],
  summary: "No written permission, no test. Scope and rules of engagement decide what, how and when.",

"ethical-hacking/m7-l5": {
  minutes: 40,
  what: "Injection happens when untrusted input is sent to an interpreter — such as a SQL database, an OS shell or an LDAP server — as part of a command, so the input can change what the command does.",
  why: "Injection has appeared in every edition of the OWASP Top 10. It can expose or alter entire databases, and it is almost entirely preventable with known coding practices.",
  body: `<p>The root cause is mixing <strong>code</strong> and <strong>data</strong> in one string. Compare two ways of looking up a user:</p>
<pre><code>// Vulnerable: input becomes part of the SQL text
query = "SELECT * FROM users WHERE email = '" + input + "'";

// Safe: the query structure is fixed; input is bound as data
query = "SELECT * FROM users WHERE email = ?";
db.execute(query, [input]);</code></pre>
<p>In the first version, specially crafted input can close the quote and add SQL of its own. In the second, the database treats the input purely as a value, whatever characters it contains.</p>
<h3>Defences, in order of importance</h3>
<ol><li><strong>Parameterized queries / prepared statements</strong> or a safe ORM.</li>
<li><strong>Allow-list input validation</strong> (for example, an ID must be digits only).</li>
<li><strong>Least-privilege database accounts</strong> so a flaw exposes as little as possible.</li>
<li><strong>Avoid shell calls</strong> with user input; use library functions instead.</li></ol>`,
  example: "In your isolated lab, an intentionally vulnerable practice application's login form builds SQL by string concatenation. The remediation section of your report recommends prepared statements and shows the corrected code.",

  exercise: "Review a small code sample of your own (or the sample above) and rewrite every database call to use parameters.",
  quiz: [
    { q: "Why do parameterized queries prevent SQL injection?", options: ["They encrypt the input", "The query structure is fixed before input is supplied", "They block special characters"], answer: 1, why: "Input is bound as data and can never be parsed as SQL." },
    { q: "Escaping quotes manually is best described as:", options: ["The preferred fix", "Fragile and easy to get wrong; use parameters instead"], answer: 1, why: "Manual escaping misses edge cases and differs between databases." }
  ],
  mistakes: ["Relying on front-end validation, which an attacker can bypass.", "Using an admin database account for the web app.", "Showing detailed database errors to users."],
  summary: "Keep code and data separate. Parameterize every query, validate input against an allow-list and limit database privileges.",
  further: ["Module 7 lesson 10: Secure coding and remediation", "OWASP Cheat Sheet Series (owasp.org)"]
}};

const POSTS = [
  { slug: "why-subnetting-still-matters", title: "Why subnetting still matters in the cloud era", date: "2026-09-02", tag: "Networking", read: 5, excerpt: "Cloud consoles hide a lot, but they still ask you for a CIDR range. Here is why that one field decides so much.", body: `<p>Every time you create a virtual network in AWS, Azure or Google Cloud, the first thing the console asks for is an address range. It looks like a formality. It is the decision that is hardest to change later.</p><h2>Overlap is forever</h2><p>If your cloud network uses 192.168.1.0/24 and so does your office, you cannot route between them over a VPN without renumbering one side. Renumbering a live network is slow and risky. Picking a range from 10.0.0.0/8 that no other site uses avoids the problem entirely.</p><h2>Size for growth</h2><p>A /24 holds 256 addresses, and cloud providers reserve some of each subnet for their own use. Containers and autoscaling can consume addresses quickly. A /16 for the network, carved into /24 subnets per zone and tier, leaves room to grow.</p><h2>Security follows structure</h2><p>Firewall rules, security groups and route tables all reference CIDR blocks. A clean plan — web, app and data tiers in predictable ranges — makes rules short and readable. A messy one produces rule lists nobody can audit.</p><p>Subnetting is not legacy knowledge. It is the grammar cloud networks are written in.</p>` },
  { slug: "your-first-security-lab", title: "Building your first isolated security lab", date: "2026-08-18", tag: "Security", read: 6, excerpt: "A safe practice lab needs three things: isolation, snapshots and written rules — even when you are the only person using it.", body: `<p>A security lab is where you are allowed to break things. That freedom depends on making sure nothing you break is outside the lab.</p><h2>1. Isolation</h2><p>Put your vulnerable-by-design machines on a host-only or internal virtual network. They should not be reachable from your home network or the internet, and they should not be able to reach out either.</p><h2>2. Snapshots</h2><p>Take a snapshot of every VM in a known-good state. When an exercise leaves a machine broken, restore it in seconds instead of reinstalling.</p><h2>3. Written rules</h2><p>Write a short rules-of-engagement file even for your own lab: which VMs are targets, which network range is in scope, and what you will not do. It builds the habit you will need on real engagements, where written authorization is mandatory.</p><p>Start small — one attacker VM, one practice target — and document as you go.</p>` },
  { slug: "reading-a-routing-table", title: "How to read a routing table in five minutes", date: "2026-07-29", tag: "Networking", read: 4, excerpt: "Destination, gateway, interface and metric. Once you know the longest-prefix rule, every routing table reads the same way.", body: `<p>Run <code>ip route</code> on Linux or <code>route print</code> on Windows and you see a list of rules. Each says: to reach this destination, send traffic via this next hop, out of this interface.</p><h2>The one rule</h2><p>When several routes match a destination, the router uses the <strong>most specific</strong> one — the longest prefix. A /24 beats a /16, which beats the default route 0.0.0.0/0.</p><h2>A worked read</h2><pre><code>default via 192.168.1.1 dev wlan0
10.8.0.0/24 dev tun0
192.168.1.0/24 dev wlan0</code></pre><p>Traffic to 10.8.0.5 uses the VPN tunnel. Traffic to 192.168.1.40 goes straight out over Wi-Fi to the local network. Everything else goes to the home router at 192.168.1.1.</p><p>When something is unreachable, find which line matches it. Most routing problems become obvious at that point.</p>` },
  { slug: "severity-is-not-risk", title: "Severity is not risk: prioritising findings", date: "2026-07-08", tag: "Security", read: 5, excerpt: "A CVSS score describes a vulnerability. Risk describes what it means for this organisation, on this system, today.", body: `<p>New assessors often sort findings by CVSS score and stop there. Clients then fix an isolated test server before their internet-facing login page.</p><h2>Add context</h2><p>For each finding, ask: Is it exposed to the internet or only internally? What data or function does the system hold? Is there a known public exploit? Is a fix available, and how disruptive is it?</p><h2>Rank by risk</h2><p>An exposed, easily exploited Medium on the payment portal can outrank a Critical on a lab machine nobody can reach. Explain the reasoning in your report so the client can trust the order.</p><p>Try the vulnerability prioritisation exercise in the lab to practise this with sample findings.</p>` }
];

  revealObs && revealObs.disconnect();

}

function searchIndex() {
  const out = [];
  getCourses().forEach(c => {
    out.push({ t: c.title, s: c.short, k: "Course", h: c.route });
    c.modules.forEach((m, i) => out.push({ t: `Module ${i + 1}: ${m.title}`, s: c.title, k: "Module", h: `${c.route}?m=${i + 1}` }));
    c.lessons.forEach(l => out.push({ t: l.title, s: c.title, k: "Lesson", h: `/learn/${c.slug}/${l.id}` }));
  });
  RESOURCES.forEach(r => out.push({ t: r.title, s: r.type, k: "Resource", h: "/resources?r=" + r.id }));
  POSTS.forEach(p => out.push({ t: p.title, s: p.excerpt, k: "Blog", h: "/blog/" + p.slug }));
  PROJECTS.forEach(p => out.push({ t: p.title, s: "Example project", k: "Project", h: "/projects" }));
  LAB_LIST.forEach(l => out.push({ t: l.title, s: l.desc, k: "Lab", h: "/labs?t=" + l.id }));
  [["Learning paths", "/learning-paths"], ["FAQ", "/faq"], ["Contact us", "/contact"], ["About MND CODE", "/about"]].forEach(([t, h]) => out.push({ t, s: "Page", k: "Page", h }));
  return out;
}
function searchFn(q, limit = 40) {
  const terms = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  return searchIndex().map(x => { const hay = (x.t + " " + x.s).toLowerCase(); let score = 0; for (const t of terms) { if (!hay.includes(t)) return null; score += x.t.toLowerCase().includes(t) ? 3 : 1; } if (x.k === "Course") score += 2; return { ...x, score }; }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, limit);
}

/* Quiz component: mount(el, questions, onDone) */
function mountQuiz(el, qs, onDone) {
  let i = 0, score = 0;
  const draw = () => {
    if (i >= qs.length) {
      el.innerHTML = `<div class="stack"><div class="row between"><h4>Result: ${score} / ${qs.length}</h4><span class="chip ${score === qs.length ? "chip-ok" : score >= qs.length / 2 ? "chip-blue" : "chip-warn"}">${Math.round(score / qs.length * 100)}%</span></div><div class="progress"><i style="width:${score / qs.length * 100}%"></i></div><p class="small muted">${score === qs.length ? "All correct. Well done." : "Review the explanations above the result, then try again."}</p><div><button class="btn btn-ghost btn-sm" type="button" data-retry>${icon("reset")}Try again</button></div></div>`;
      $("[data-retry]", el).onclick = () => { i = 0; score = 0; draw(); };
      onDone && onDone(score, qs.length);
      return;
    }
    const q = qs[i];
    el.innerHTML = `<div class="quiz"><div class="row between"><span class="xs mono dim">QUESTION ${i + 1} OF ${qs.length}</span><span class="xs mono dim">SCORE ${score}</span></div><div class="progress"><i style="width:${i / qs.length * 100}%"></i></div>
      <h4 style="font-size:var(--t-base)" id="qh${i}">${esc(q.q)}</h4><div class="q-opts" role="group" aria-labelledby="qh${i}">${q.options.map((o, k) => `<button class="q-opt" type="button" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div><div data-fb aria-live="polite"></div></div>`;
    $$(".q-opt", el).forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.answer; if (ok) score++;
      $$(".q-opt", el).forEach(x => { x.disabled = true; if (+x.dataset.k === q.answer) x.classList.add("right"); });
      if (!ok) b.classList.add("wrong");
      $("[data-fb]", el).innerHTML = `<div class="alert ${ok ? "alert-ok" : "alert-bad"}">${icon(ok ? "check" : "alert")}<div><strong>${ok ? "Correct." : "Not quite."}</strong> ${esc(q.why)}</div></div><div style="margin-top:12px"><button class="btn btn-primary btn-sm" type="button" data-next>${i + 1 < qs.length ? "Next question" : "See result"} ${icon("arrow")}</button></div>`;
      $("[data-next]", el).onclick = () => { i++; draw(); };
      $("[data-next]", el).focus();
    });
  };
  draw();
}

    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1;
    edges.forEach(([a, b]) => { const A = nodes[a], B = nodes[b]; const g = ctx.createLinearGradient(A.x, A.y, B.x, B.y); g.addColorStop(0, "rgba(59,130,246,.45)"); g.addColorStop(1, "rgba(34,211,238,.15)"); ctx.strokeStyle = g; ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke(); });
    if (!reduce && Math.random() < .06 && packets.length < 14) { const e = edges[Math.floor(Math.random() * edges.length)]; const rev = Math.random() < .5; packets.push({ a: rev ? e[1] : e[0], b: rev ? e[0] : e[1], p: 0, s: .006 + Math.random() * .01, c: Math.random() < .15 ? "#8B5CF6" : "#22D3EE" }); }
    packets = packets.filter(p => p.p <= 1);
    packets.forEach(p => { p.p += p.s; const A = nodes[p.a], B = nodes[p.b]; const x = A.x + (B.x - A.x) * p.p, y = A.y + (B.y - A.y) * p.p; ctx.save(); ctx.fillStyle = p.c; ctx.shadowColor = p.c; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 7); ctx.fill(); ctx.restore(); });
    nodes.forEach(n => glyph(n, t));
    if (!reduce && cv.isConnected) raf = requestAnimationFrame(frame);
  }
  size(); frame(0);
  const ro = new ResizeObserver(() => { size(); if (reduce) frame(0); }); ro.observe(cv);
  // live-looking telemetry is labelled as simulated in the UI
  const tel = () => { if (!cv.isConnected) return; const a = $("#telA"), b = $("#telB"); if (a) a.textContent = (14 + Math.random() * 9).toFixed(1) + " ms"; if (b) b.textContent = (93 + Math.random() * 6).toFixed(1) + "%"; setTimeout(tel, 1600); };
  if (!reduce) tel();
}

/* ---------- 1. Subnetting ---------- */
const ip2n = s => { const p = s.trim().split("."); if (p.length !== 4 || p.some(x => !/^\d{1,3}$/.test(x) || +x > 255)) return null; return p.reduce((a, x) => a * 256 + +x, 0); };
const n2ip = n => [24, 16, 8, 0].map(s => Math.floor(n / 2 ** s) % 256).join(".");
const toBin = n => [24, 16, 8, 0].map(s => (Math.floor(n / 2 ** s) % 256).toString(2).padStart(8, "0")).join(".");
function subnet(ipStr, prefix) {
  const ip = ip2n(ipStr); if (ip == null) return { error: "Enter a valid IPv4 address: four numbers from 0 to 255 separated by dots, e.g. 192.168.10.77." };
  prefix = +prefix; if (!(prefix >= 0 && prefix <= 32)) return { error: "Prefix must be between 0 and 32." };
  const size = 2 ** (32 - prefix), mask = 2 ** 32 - size, net = Math.floor(ip / size) * size, bc = net + size - 1;
  const usable = prefix === 32 ? 1 : prefix === 31 ? 2 : size - 2;
  const first = prefix >= 31 ? net : net + 1, last = prefix >= 31 ? bc : bc - 1;
  const o1 = Math.floor(ip / 2 ** 24), o2 = Math.floor(ip / 2 ** 16) % 256;
  const priv = o1 === 10 || (o1 === 172 && o2 >= 16 && o2 <= 31) || (o1 === 192 && o2 === 168);
  const type = o1 === 127 ? "Loopback" : (o1 === 169 && o2 === 254) ? "Link-local (APIPA)" : o1 >= 224 && o1 <= 239 ? "Multicast" : (o1 === 100 && o2 >= 64 && o2 <= 127) ? "Shared (CGNAT)" : priv ? "Private (RFC 1918)" : "Public";
  return { ip, prefix, size, mask, net, bc, usable, first, last, type, wildcard: 2 ** 32 - 1 - mask };
}

const PJ = {

    const step = async (t, d = 380) => { const li = document.createElement("li"); li.className = "on"; li.innerHTML = t; $$("li", L).forEach(x => x.className = ""); L.appendChild(li); await sleep(matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : d); };

/* ---------- 7. Firewall rules ---------- */
const cidrMatch = (ip, cidr) => { if (cidr === "any") return true; const [n, p] = cidr.split("/"); const size = 2 ** (32 - +(p ?? 32)); return Math.floor(ip2n(ip) / size) === Math.floor(ip2n(n) / size); };
function mountFirewall(el) {

    { id: 1, act: "allow", proto: "tcp", src: "any", dst: "10.0.1.10/32", port: "443", note: "HTTPS to web server" },
    { id: 2, act: "allow", proto: "tcp", src: "10.0.2.0/24", dst: "10.0.3.5/32", port: "5432", note: "App tier to database" },
    { id: 3, act: "deny", proto: "tcp", src: "any", dst: "any", port: "22", note: "Block SSH" },
    { id: 4, act: "allow", proto: "tcp", src: "192.168.50.0/24", dst: "any", port: "22", note: "Admin VPN SSH" },
    { id: 5, act: "allow", proto: "udp", src: "10.0.0.0/16", dst: "10.0.0.2/32", port: "53", note: "Internal DNS" },
    { id: 6, act: "deny", proto: "any", src: "any", dst: "any", port: "any", note: "Default deny" }];

  let guesses = {};
  const evalP = p => { for (const r of rules) { if ((r.proto === "any" || r.proto === p[2]) && cidrMatch(p[0], r.src) && cidrMatch(p[1], r.dst) && (r.port === "any" || +r.port === p[3])) return r; } return null; };
  const draw = (reveal = false) => {
    el.innerHTML = `<p class="small muted" style="margin-bottom:16px">Rules are checked top to bottom; the first match wins. Predict each packet's outcome, then check. Try moving rule 4 above rule 3 and see what changes.</p>
    <div class="table-wrap"><table><thead><tr><th>#</th><th>Action</th><th>Proto</th><th>Source</th><th>Destination</th><th>Port</th><th>Purpose</th><th>Order</th></tr></thead><tbody>${rules.map((r, i) => `<tr><td class="num">${i + 1}</td><td><span class="chip ${r.act === "allow" ? "chip-ok" : "chip-bad"}">${r.act}</span></td><td class="num">${r.proto}</td><td class="num">${r.src}</td><td class="num">${r.dst}</td><td class="num">${r.port}</td><td>${r.note}</td><td><div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn btn-quiet btn-sm" type="button" data-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="Move rule ${i + 1} up">${icon("up")}</button><button class="btn btn-quiet btn-sm" type="button" data-dn="${i}" ${i === rules.length - 1 ? "disabled" : ""} aria-label="Move rule ${i + 1} down">${icon("down")}</button></div></td></tr>`).join("")}</tbody></table></div>
    <h4 style="font-size:var(--t-base);margin:24px 0 10px">Synthetic traffic</h4>
    <div class="table-wrap"><table><thead><tr><th>Packet</th><th>Source</th><th>Destination</th><th>Proto/Port</th><th>Your prediction</th>${reveal ? "<th>Result</th>" : ""}</tr></thead><tbody>${PKTS.map((p, i) => { const r = evalP(p), res = r ? r.act : "deny", g = guesses[i]; return `<tr><td class="num">P${i + 1}</td><td class="num">${p[0]}</td><td class="num">${p[1]}</td><td class="num">${p[2]}/${p[3]}</td><td><div class="row" style="gap:6px;flex-wrap:nowrap">${["allow", "deny"].map(a => `<button type="button" class="btn btn-sm ${g === a ? (a === "allow" ? "btn-primary" : "btn-danger") : "btn-ghost"}" data-g="${i}" data-a="${a}" aria-pressed="${g === a}">${a}</button>`).join("")}</div></td>${reveal ? `<td>${g === res ? icon("check", "icon", 'style="color:var(--ok);width:16px;height:16px;vertical-align:-3px"') : icon("x", "icon", 'style="color:var(--bad);width:16px;height:16px;vertical-align:-3px"')} <strong>${res}</strong> <span class="xs dim">by rule ${rules.indexOf(r) + 1} (${r.note})</span></td>` : ""}</tr>`; }).join("")}</tbody></table></div>
    <div class="row" style="margin-top:16px"><button class="btn btn-primary" type="button" id="fw-chk">Check predictions</button><button class="btn btn-quiet" type="button" id="fw-r">${icon("reset")}Reset</button><span id="fw-s" class="small" aria-live="polite"></span></div>${SIM_NOTE}`;
    $$("[data-g]", el).forEach(b => b.onclick = () => { guesses[b.dataset.g] = b.dataset.a; draw(reveal); });
    $$("[data-up]", el).forEach(b => b.onclick = () => { const i = +b.dataset.up; [rules[i - 1], rules[i]] = [rules[i], rules[i - 1]]; draw(reveal); });
    $$("[data-dn]", el).forEach(b => b.onclick = () => { const i = +b.dataset.dn; [rules[i + 1], rules[i]] = [rules[i], rules[i + 1]]; draw(reveal); });
    $("#fw-chk", el).onclick = () => { if (Object.keys(guesses).length < PKTS.length) { $("#fw-s", el).innerHTML = `<span style="color:#FCD34D">Predict all ${PKTS.length} packets first (${Object.keys(guesses).length} done).</span>`; return; } draw(true); const n = PKTS.filter((p, i) => guesses[i] === (evalP(p) ? evalP(p).act : "deny")).length; $("#fw-s", el).innerHTML = `<strong>${n} / ${PKTS.length}</strong> correct.`; };
    $("#fw-r", el).onclick = () => mountFirewall(el);
  };
  draw();
}
